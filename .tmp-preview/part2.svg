<svg xmlns="http://www.w3.org/2000/svg" width="3360" height="1080" viewBox="0 0 3360 1080"><rect width="3360" height="1080" fill="#ffffff"/><text x="0" y="34" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#18181b">S-02 교육 모드 (태블릿 전체)</text><g transform="translate(0,56)"><rect width="768" height="1024" fill="#fafafa"/><text x="24" y="40" font-family="Noto Sans KR" font-size="13" fill="#71717a">‹ 뒤로</text><text x="384" y="40" font-family="Noto Sans KR" font-size="12" fill="#71717a" text-anchor="middle">오픈조 · 들어오자마자</text><text x="744" y="40" font-family="Noto Sans KR" font-size="12" font-weight="700" fill="#71717a" text-anchor="end">1 / 9</text><rect x="24" y="56" width="720" height="6" rx="3" fill="#e4e4e7"/><rect x="24" y="56" width="80" height="6" rx="3" fill="#f97316"/><rect x="24" y="110" width="96" height="28" rx="14" fill="#fef2f2"/><text x="72" y="129" font-family="Noto Sans KR" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">꼭 지키기</text><text x="24" y="200" font-family="Noto Sans KR" font-size="32" font-weight="700" fill="#18181b">손 씻고 위생 복장 착용</text><text x="24" y="248" font-family="Noto Sans KR" font-size="18" fill="#71717a">손목까지 30초 이상. 앞치마, 모자, 편한 신발까지</text><text x="24" y="276" font-family="Noto Sans KR" font-size="18" fill="#71717a">갖추고 시작합니다.</text><rect x="24" y="316" width="352" height="220" rx="16" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="2"/><text x="200" y="420" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#a1a1aa" text-anchor="middle">좋은 예</text><text x="200" y="442" font-family="Noto Sans KR" font-size="12" fill="#a1a1aa" text-anchor="middle">촬영 후 여기</text><rect x="392" y="316" width="352" height="220" rx="16" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="2"/><text x="568" y="420" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#a1a1aa" text-anchor="middle">나쁜 예</text><text x="568" y="442" font-family="Noto Sans KR" font-size="12" fill="#a1a1aa" text-anchor="middle">촬영 후 여기</text><rect x="24" y="566" width="720" height="56" rx="14" fill="#f97316"/><text x="384" y="601" font-family="Noto Sans KR" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">읽었습니다</text><rect x="24" y="636" width="354" height="52" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="201" y="669" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#71717a" text-anchor="middle">이전</text><rect x="390" y="636" width="354" height="52" rx="14" fill="#e4e4e7"/><text x="567" y="669" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#a1a1aa" text-anchor="middle">다음</text><text x="384" y="716" font-family="Noto Sans KR" font-size="12" fill="#a1a1aa" text-anchor="middle">위의 [읽었습니다]를 눌러야 넘어갑니다</text></g><text x="864" y="34" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#18181b">S-09 출퇴근 · 근태</text><g transform="translate(864,56)"><rect width="768" height="1024" fill="#fafafa"/><text x="24" y="40" font-family="Noto Sans KR" font-size="12" fill="#71717a">○○ 베이커리 카페</text><text x="24" y="68" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#18181b">출퇴근 · 근태</text><rect x="24" y="96" width="180" height="40" rx="12" fill="#f97316"/><text x="114" y="122" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">오늘 (9/10 목)</text><rect x="212" y="96" width="160" height="40" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="292" y="122" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#71717a" text-anchor="middle">이번 주 · 근태</text><text x="24" y="160" font-family="Noto Sans KR" font-size="12" fill="#71717a">지금 21:20 · 버튼을 누르면 그 시각으로 찍힙니다. 잘못 찍었으면 고칠 수 있습니다.</text><rect x="24" y="178" width="720" height="108" rx="16" fill="#ffffff" stroke="#e4e4e7"/><text x="44" y="208" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#18181b">김제빵</text><text x="92" y="208" font-family="Noto Sans KR" font-size="12" fill="#71717a">제빵</text><text x="44" y="230" font-family="Noto Sans KR" font-size="12" fill="#71717a">근무표: 07:30~15:30</text><rect x="44" y="242" width="334" height="32" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="211" y="263" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#f97316" text-anchor="middle">출근 07:32</text><rect x="390" y="242" width="334" height="32" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="557" y="263" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#18181b" text-anchor="middle">퇴근</text><rect x="24" y="298" width="720" height="108" rx="16" fill="#ffffff" stroke="#e4e4e7"/><text x="44" y="328" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#18181b">이바리스타</text><text x="124" y="328" font-family="Noto Sans KR" font-size="12" fill="#71717a">바</text><text x="44" y="350" font-family="Noto Sans KR" font-size="12" fill="#71717a">근무표: 07:30~15:30</text><rect x="44" y="362" width="334" height="32" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="211" y="383" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#18181b" text-anchor="middle">출근</text><rect x="390" y="362" width="334" height="32" rx="10" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="557" y="383" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#18181b" text-anchor="middle">퇴근</text><rect x="24" y="418" width="720" height="56" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/><text x="44" y="452" font-family="Noto Sans KR" font-size="13" fill="#a1a1aa">인건비   🔒   사장님 번호를 넣으면 보입니다</text><rect x="24" y="486" width="720" height="70" rx="12" fill="#fffbeb"/><text x="44" y="512" font-family="Noto Sans KR" font-size="12" font-weight="700" fill="#78350f">인건비는 추정입니다</text><text x="44" y="532" font-family="Noto Sans KR" font-size="12" fill="#78350f">4대보험·소득세·수습감액·주휴수당이 빠져 있습니다. 급여 대장이 아닙니다.</text><rect x="0" y="960" width="768" height="64" fill="#ffffff" stroke="#e4e4e7"/><circle cx="76.8" cy="982" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="76.8" y="1008" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">오늘</text><circle cx="230.4" cy="982" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="230.4" y="1008" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">프렙</text><circle cx="384" cy="982" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="384" y="1008" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">발주</text><circle cx="537.6" cy="982" r="9" fill="none" stroke="#f97316" stroke-width="1.5"/><text x="537.6" y="1008" font-family="Noto Sans KR" font-size="11" font-weight="700" fill="#f97316" text-anchor="middle">출퇴근</text><circle cx="691.2" cy="982" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="691.2" y="1008" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">운영</text></g><text x="1728" y="34" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#18181b">S-14 매출 (사장님)</text><g transform="translate(1728,56)"><rect width="768" height="1024" fill="#fafafa"/><text x="24" y="40" font-family="Noto Sans KR" font-size="12" fill="#71717a">○○ 베이커리 카페</text><text x="24" y="68" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#18181b">매출</text><text x="24" y="128" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#18181b">총매출</text><rect x="200" y="108" width="544" height="44" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="724" y="137" font-family="Noto Sans KR" font-size="16" fill="#18181b" text-anchor="end">1,250,000</text><text x="24" y="188" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#18181b">결제 건수</text><rect x="200" y="168" width="544" height="44" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="724" y="197" font-family="Noto Sans KR" font-size="16" fill="#18181b" text-anchor="end">180</text><text x="24" y="248" font-family="Noto Sans KR" font-size="13" font-weight="700" fill="#18181b">재료비</text><rect x="200" y="228" width="544" height="44" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="724" y="257" font-family="Noto Sans KR" font-size="16" fill="#18181b" text-anchor="end">300,000</text><rect x="24" y="292" width="720" height="156" rx="16" fill="#ffffff" stroke="#e4e4e7"/><text x="44" y="322" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#18181b">오늘 남은 돈</text><text x="44" y="350" font-family="Noto Sans KR" font-size="13" fill="#71717a">매출</text><text x="724" y="350" font-family="Noto Sans KR" font-size="14" fill="#18181b" text-anchor="end">1,250,000원</text><text x="44" y="374" font-family="Noto Sans KR" font-size="13" fill="#71717a">− 재료비</text><text x="724" y="374" font-family="Noto Sans KR" font-size="14" fill="#18181b" text-anchor="end">300,000원</text><text x="44" y="398" font-family="Noto Sans KR" font-size="13" fill="#71717a">− 인건비 (추정)</text><text x="724" y="398" font-family="Noto Sans KR" font-size="14" fill="#18181b" text-anchor="end">182,400원</text><rect x="44" y="416" width="680" height="1" fill="#e4e4e7"/><text x="44" y="446" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#18181b">남은 돈</text><text x="724" y="448" font-family="Noto Sans KR" font-size="22" font-weight="700" fill="#f97316" text-anchor="end">767,600원</text><rect x="24" y="464" width="720" height="78" rx="12" fill="#fffbeb"/><text x="44" y="490" font-family="Noto Sans KR" font-size="12" font-weight="700" fill="#78350f">이 숫자를 얼마나 믿어도 되는가</text><text x="44" y="510" font-family="Noto Sans KR" font-size="12" fill="#78350f">인건비는 추정이고, 단가를 못 구한 재료는 원가에서 빠져 있습니다.</text><text x="44" y="530" font-family="Noto Sans KR" font-size="12" fill="#78350f">가격을 정하실 때는 거래처 단가를 먼저 채워주세요.</text><rect x="0" y="960" width="768" height="64" fill="#ffffff" stroke="#e4e4e7"/><circle cx="76.8" cy="982" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="76.8" y="1008" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">오늘</text><circle cx="230.4" cy="982" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="230.4" y="1008" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">프렙</text><circle cx="384" cy="982" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="384" y="1008" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">발주</text><circle cx="537.6" cy="982" r="9" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="537.6" y="1008" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">출퇴근</text><circle cx="691.2" cy="982" r="9" fill="none" stroke="#f97316" stroke-width="1.5"/><text x="691.2" y="1008" font-family="Noto Sans KR" font-size="11" font-weight="700" fill="#f97316" text-anchor="middle">운영</text></g><text x="2592" y="34" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#18181b">상태 3종 (잠김 · 오류 · 비었음)</text><g transform="translate(2592,56)"><rect width="768" height="1024" fill="#fafafa"/><text x="24" y="44" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#18181b">상태 화면 — 자주 빠뜨리는 것</text><text x="24" y="68" font-family="Noto Sans KR" font-size="12" fill="#71717a">이 세 개를 안 만들어두면 개발자가 아무렇게나 만듭니다.</text><text x="24" y="108" font-family="Noto Sans KR" font-size="14" font-weight="700" fill="#18181b">① 잠김 — 매장 번호</text><rect x="24" y="122" width="720" height="172" rx="16" fill="#ffffff" stroke="#e4e4e7"/><text x="44" y="154" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#18181b">매장 직원만 볼 수 있습니다</text><text x="44" y="176" font-family="Noto Sans KR" font-size="12" fill="#71717a">레시피는 매장 자산입니다. 매장 번호를 넣어주세요.</text><rect x="44" y="192" width="580" height="44" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/><text x="60" y="220" font-family="Noto Sans KR" font-size="16" fill="#a1a1aa">매장 번호</text><rect x="636" y="192" width="88" height="44" rx="12" fill="#f97316"/><text x="680" y="220" font-family="Noto Sans KR" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">열기</text><text x="44" y="260" font-family="Noto Sans KR" font-size="12" fill="#a1a1aa">자물쇠를 무섭게 그리지 마세요 — 신입이 '나는 못 보는 곳'이라고</text><text x="44" y="278" font-family="Noto Sans KR" font-size="12" fill="#a1a1aa">물러나면 안 됩니다. 레시피는 신입이 제일 많이 여는 화면입니다.</text><text x="24" y="330" font-family="Noto Sans KR" font-size="14" font-weight="700" fill="#18181b">② 오류 — 크래시</text><rect x="24" y="344" width="720" height="168" rx="16" fill="#ffffff" stroke="#e4e4e7"/><text x="384" y="384" font-family="Noto Sans KR" font-size="17" font-weight="700" fill="#18181b" text-anchor="middle">이 화면을 여는 중에 문제가 생겼습니다</text><text x="384" y="410" font-family="Noto Sans KR" font-size="13" fill="#71717a" text-anchor="middle">입력하신 기록은 이 기기에 그대로 있습니다.</text><rect x="180" y="430" width="408" height="48" rx="14" fill="#f97316"/><text x="384" y="460" font-family="Noto Sans KR" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">다시 열기</text><text x="384" y="498" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">★ '기록은 남아 있습니다' 를 먼저 말합니다</text><text x="24" y="548" font-family="Noto Sans KR" font-size="14" font-weight="700" fill="#18181b">③ 비었음 — 0건</text><rect x="24" y="562" width="720" height="112" rx="16" fill="none" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="8 6"/><text x="384" y="606" font-family="Noto Sans KR" font-size="13" fill="#71717a" text-anchor="middle">아직 거래처가 없습니다.</text><text x="384" y="630" font-family="Noto Sans KR" font-size="13" fill="#71717a" text-anchor="middle">우유 한 곳만 먼저 넣어보세요. 그러면 원가가 계산됩니다.</text><text x="384" y="660" font-family="Noto Sans KR" font-size="11" fill="#a1a1aa" text-anchor="middle">★ '없습니다'로 끝내지 말고 다음에 뭘 하면 되는지 적습니다</text></g></svg>