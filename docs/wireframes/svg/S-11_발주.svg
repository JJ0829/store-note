  <line x1="1" y1="960.5" x2="787" y2="960.5" stroke="#e4e4e7"/>

  <g id="tab_today" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M3 10.5 12 4l9 6.5V19a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" transform="translate(68 974)"/>
  </g>
  <text x="79" y="1010" font-size="11" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Noto Sans KR, sans-serif">오늘</text>

  <g id="tab_prep" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M5 4h11l3 3v13H5z" transform="translate(226 974)"/>
    <path d="M9 10h6M9 14h6" transform="translate(226 974)"/>
  </g>
  <text x="237" y="1010" font-size="11" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Noto Sans KR, sans-serif">프렙</text>

  <g id="tab_order_on" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M3 6h13l2 9H6z" transform="translate(383 974)"/>
