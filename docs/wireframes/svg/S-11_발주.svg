    <circle cx="16" cy="19" r="1.6" transform="translate(383 974)"/>
  </g>
  <text x="394" y="1010" font-size="11" font-weight="700" fill="#ea580c" text-anchor="middle" font-family="Noto Sans KR, sans-serif">발주</text>

  <g id="tab_attendance" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
