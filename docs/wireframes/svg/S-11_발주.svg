  <text x="551" y="1010" font-size="11" font-weight="700" fill="#71717a" text-anchor="middle" font-family="Noto Sans KR, sans-serif">출퇴근</text>

  <g id="tab_ops" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
