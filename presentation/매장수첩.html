  const lockSec = el(`<section class="sec"></section>`);
  if (!hasPin()) {
    const b = el(`<button type="button" style="width:100%;padding:13px;border-style:dashed;border-width:2px;
      font-size:13px;font-weight:600;color:var(--ink-2)">🔒 매출·시급 화면에 잠금번호 걸기</button>`);
    b.onclick = () => {
      const card = el(`<div class="card" style="padding:16px">
        <b style="font-size:15px">잠금번호 만들기</b>
        <p class="muted" style="margin:5px 0 0">숫자 4자리 이상. 이 태블릿에만 저장됩니다.
        잊으면 되돌릴 수 없으니 사장님만 아는 번호로 하세요.</p>
        <div class="stack" style="margin-top:12px"></div></div>`);
      const box = card.querySelector(".stack");
      const p1 = el(`<input type="password" inputmode="numeric" autocomplete="new-password" placeholder="잠금번호" aria-label="잠금번호">`);
      const p2 = el(`<input type="password" inputmode="numeric" autocomplete="new-password" placeholder="한 번 더" aria-label="잠금번호 확인">`);
      const err = el(`<p style="margin:0;font-size:13px;font-weight:600;color:var(--danger);display:none"></p>`);
      const mk = el(`<button type="button" class="btn-primary" style="padding:13px">만들기</button>`);
      const fail = m => { err.textContent = m; err.style.display = "block"; };
      mk.onclick = () => {
        if (p1.value.length < 4) return fail("4자리 이상으로 해주세요.");
        if (p1.value !== p2.value) return fail("두 번 입력한 번호가 다릅니다.");
        if (!setOwnerPin(p1.value)) return fail("이 태블릿에 저장할 수 없습니다.");
        render();
      };
      box.append(p1, p2, err, mk);
      box.appendChild(el(`<p style="margin:2px 0 0;background:var(--warn-w);color:var(--warn-t);border-radius:12px;
        padding:11px 13px;font-size:12px;line-height:1.6">이 잠금은 <b>다른 직원이 실수로 열어보는 것</b>까지만
        막습니다. 기기를 가진 사람이 브라우저 도구를 쓰면 볼 수 있습니다. 진짜 차단은 서버를 붙일 때 됩니다.</p>`));
      b.replaceWith(card);
    };
    lockSec.appendChild(b);
  } else {
    const openNow = ownerOpen();
    lockSec.appendChild(el(`<p class="muted" style="text-align:center">🔒 사장님 화면은 잠금번호로 보호됩니다${
      openNow ? " · 지금 열려 있음" : ""}</p>`));
    /* 브라우저를 닫으면 알아서 잠기지만, 매장 태블릿은 하루 종일 켜져 있다.
       사장님이 매출을 보고 자리를 비우면 다음 사람이 그대로 본다. */
    if (openNow) {
      const b = el(`<button type="button" style="display:block;margin:8px auto 0;padding:9px 16px;
        font-size:13px;font-weight:600;color:var(--ink-2)">지금 잠그기</button>`);
      b.onclick = () => { lockOwner(); render(); };
      lockSec.appendChild(b);
    }
  }
  v.appendChild(lockSec);
}

/* ------------------------------------------------------------------ *
   거래처 · 품목 단가 — 원가의 뿌리
 * ------------------------------------------------------------------ */
function renderVendors() {
  if (!opsGate("거래처")) return;
  topbar({ title: "거래처", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  let data = loadVendors();
  let settings = loadSettings();
  let openId = null;

  const ingredientNames = [...new Set(
    DATA.recipes.flatMap(r => r.ingredients.map(i => String(i.name).trim()))
  )].filter(Boolean).sort((a, b) => a.localeCompare(b, "ko"));

  const save = () => { saveVendors(data); draw(); };
  const saveS = () => { saveSettings(settings); draw(); };

  function toggleExcluded(name) {
    const key = String(name).trim();
    settings.excluded = settings.excluded.some(n => String(n).trim() === key)
      ? settings.excluded.filter(n => String(n).trim() !== key)
      : [...settings.excluded, key];
    saveS();
  }

  function draw() {
    v.innerHTML = "";

    /* ---------- 단가가 빠진 재료를 먼저 띄운다 ----------
       여기를 안 채우면 원가 화면이 전부 "단가가 없습니다"다.
       사장님이 뭘 채워야 하는지 스스로 찾게 만들면 안 채운다. */
    const priced = new Set(data.items.map(i => String(i.name).trim()));
    const skipped = new Set(settings.excluded.map(n => String(n).trim()));
    const unpriced = ingredientNames.filter(n => !priced.has(n) && !skipped.has(n));

    const head = el(`<div class="card" style="padding:16px;margin-top:16px">
      <b style="font-size:15px">${unpriced.length === 0
        ? "레시피 재료 단가가 모두 들어왔습니다"
        : `단가가 없는 재료 ${unpriced.length}개`}</b>
      <p class="muted" style="margin:5px 0 0;line-height:1.6">${unpriced.length === 0
        ? "원가 화면에서 메뉴별 원가율을 볼 수 있습니다."
        : "이게 남아 있으면 원가가 실제보다 낮게 나옵니다. 눌러서 바로 등록하세요."}</p>
    </div>`);

    if (unpriced.length) {
      const list = el(`<div style="margin-top:10px"></div>`);
      for (const n of unpriced) {
        const row = el(`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;
          padding:8px 0;border-top:1px solid var(--line)">
          <span style="font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span>
          <span style="display:flex;gap:6px;flex:none"></span></div>`);
        const btns = row.querySelector("span:last-child");
        const add = el(`<button type="button" style="padding:6px 11px;font-size:12px;font-weight:600;
          border-style:dashed;border-width:2px;border-color:var(--accent-b);color:var(--accent)">단가 넣기</button>`);
        add.onclick = () => {
          if (!data.vendors.length) return alert("거래처를 먼저 하나 추가해 주세요.");
          const it = newVendorItem(data.vendors[0].id);
          it.name = n;
          data.items.push(it);
          openId = data.vendors[0].id;
          save();
        };
        const skip = el(`<button type="button" style="padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink-3)">안 셈</button>`);
        skip.onclick = () => toggleExcluded(n);
        btns.append(add, skip);
        list.appendChild(row);
      }
      head.appendChild(list);
    }

    /* 제외한 재료 — 되돌릴 수 있어야 한다 */
    if (settings.excluded.length) {
      const box = el(`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:11px">
        <p class="muted" style="margin:0;line-height:1.6">원가에 안 세는 재료 — 수돗물처럼 값이 없는 것,
        그리고 <b>아메리카노의 '추출량'처럼 사는 게 아니라 결과인 것</b>. 여기에 단가를 붙이면
        원두 값이 두 번 계산됩니다.</p>
        <div class="row-in" style="margin-top:8px"></div></div>`);
      const wrap = box.querySelector(".row-in");
      for (const n of settings.excluded) {
        const b = el(`<button type="button" style="padding:6px 11px;font-size:12px;font-weight:600;
          background:var(--sunken);color:var(--ink-3);text-decoration:line-through">${esc(n)} ×</button>`);
        b.onclick = () => toggleExcluded(n);
        wrap.appendChild(b);
      }
      head.appendChild(box);
    }
    v.appendChild(head);

    /* ---------- 거래처 목록 ---------- */
    const sec = el(`<section class="sec" style="margin-top:16px"><div class="rows"></div></section>`);
    const rows = sec.querySelector(".rows");

    if (!data.vendors.length) {
      rows.appendChild(emptyBox("거래처가 없습니다.<br>우유·원두·부자재는 보통 거래처가 따로입니다. 자주 쓰는 곳부터 하나 추가해 보세요."));
    }

    for (const vd of data.vendors) {
      const items = data.items.filter(i => i.vendorId === vd.id);
      const isOpen = openId === vd.id;
      const card = el(`<div class="card" style="padding:14px 16px"></div>`);

      const header = el(`<div style="display:flex;align-items:flex-start;gap:8px"></div>`);
      const hit = el(`<button type="button" style="flex:1;min-width:0;text-align:left;background:none;border:0;padding:0">
        <b style="display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(vd.name || "(이름 없음)")}</b>
        <span class="meta" style="display:block;font-size:12px;color:var(--ink-3);margin-top:2px">${esc(vd.how)} ·
        마감 ${esc(vd.cutoff)} · 주문 후 ${vd.leadDays}일 · 품목 ${items.length}개</span></button>`);
      hit.onclick = () => { openId = isOpen ? null : vd.id; draw(); };
      header.appendChild(hit);
      if (vd.phone) header.appendChild(el(`<a class="btn" href="tel:${esc(vd.phone.replace(/[^\d+]/g, ""))}"
        style="padding:7px 11px;font-size:13px;flex:none">전화</a>`));
      header.appendChild(el(`<span style="color:var(--ink-3);font-size:17px;flex:none">${isOpen ? "⌃" : "⌄"}</span>`));
      card.appendChild(header);

      if (isOpen) {
        const body = el(`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px"></div>`);
        const g = el(`<div class="grid2"></div>`);
        const full = el(`<div style="grid-column:1 / -1"></div>`);
        full.appendChild(field("거래처 이름", textIn(vd.name, x => { vd.name = x; saveVendors(data); }, "", "거래처 이름")));
        g.appendChild(full);
        g.appendChild(field("전화번호", textIn(vd.phone, x => { vd.phone = x; saveVendors(data); }, "010-0000-0000", "전화번호")));
        g.appendChild(field("담당자", textIn(vd.contact, x => { vd.contact = x; saveVendors(data); }, "", "담당자")));
        g.appendChild(field("주문 마감 시각", textIn(vd.cutoff, x => { vd.cutoff = x; saveVendors(data); }, "15:00", "주문 마감 시각")));
        g.appendChild(field("주문 후 며칠", numIn(vd.leadDays, x => { vd.leadDays = x; saveVendors(data); }, "1", "리드타임(일)")));
        body.appendChild(g);

        body.appendChild(el(`<p class="muted" style="margin:13px 0 6px">주문 방법</p>`));
        const hw = el(`<div class="row-in"></div>`);
        for (const h of HOW_OPTIONS) hw.appendChild(chip(h, vd.how === h, () => { vd.how = h; save(); }));
        body.appendChild(hw);

        body.appendChild(el(`<p class="muted" style="margin:13px 0 6px;line-height:1.6">배송하는 요일 —
          여기서 뺀 요일은 다음 배송일로 밀려서 계산됩니다</p>`));
        const dw = el(`<div class="row-in"></div>`);
        WD.forEach((w, i) => dw.appendChild(chip(w, vd.deliverDays.includes(i), () => {
          vd.deliverDays = vd.deliverDays.includes(i)
            ? vd.deliverDays.filter(d => d !== i) : [...vd.deliverDays, i].sort();
          save();
        })));
        body.appendChild(dw);

        const note = field("메모", textIn(vd.note, x => { vd.note = x; saveVendors(data); }, "최소 주문금액, 계좌 등", "메모"));
        note.style.marginTop = "13px";
        body.appendChild(note);

        /* ---------- 품목 ---------- */
        body.appendChild(el(`<h3 style="margin:20px 0 2px;font-size:14px;font-weight:700">품목과 단가
          <span style="font-weight:400;font-size:12px;color:var(--ink-3)">이름이 레시피 재료명과 같아야 원가가 붙습니다</span></h3>`));
        const ilist = el(`<div class="stack" style="margin-top:8px"></div>`);
        for (const it of items) {
          const box = el(`<div style="border:1px solid var(--line);border-radius:12px;padding:11px"></div>`);
          const top = el(`<div style="display:flex;gap:8px"></div>`);
          const nameIn = textIn(it.name, x => { it.name = x; saveVendors(data); }, "품목 이름", "품목 이름");
          nameIn.setAttribute("list", "ing-names");
          nameIn.style.flex = "1";
          top.appendChild(nameIn);
          const del = el(`<button type="button" style="flex:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--danger)"
            aria-label="${esc((it.name || "품목") + " 지우기")}">삭제</button>`);
          del.onclick = () => { data.items = data.items.filter(x => x.id !== it.id); save(); };
          top.appendChild(del);
          box.appendChild(top);

          const line = el(`<div class="row-in" style="margin-top:8px;align-items:center"></div>`);
          line.appendChild(numIn(it.packAmount, x => { it.packAmount = x; saveVendors(data); redrawPer(); }, "1000", "구매 수량", 96));
          const uIn = textIn(it.packUnit, x => { it.packUnit = x; saveVendors(data); redrawPer(); }, "g", "단위", 66);
          uIn.setAttribute("list", "common-units");
          line.appendChild(uIn);
          line.appendChild(el(`<span class="muted">당</span>`));
          line.appendChild(numIn(it.packPrice, x => { it.packPrice = x; saveVendors(data); redrawPer(); }, "28000", "가격", 118));
          line.appendChild(el(`<span class="muted">원</span>`));
          box.appendChild(line);

          const per = el(`<p style="margin:8px 0 0;font-family:var(--mono);font-size:12px;color:var(--ink-3)"></p>`);
          const redrawPer = () => {
            per.innerHTML = (it.packAmount > 0 && Number.isFinite(it.packPrice))
              ? `${esc(it.packUnit)} 1당 <b style="color:var(--ink)">${(it.packPrice / it.packAmount).toFixed(2)}원</b>
                 · ${won(it.packPrice)}원 / ${it.packAmount}${esc(it.packUnit)}` : "";
          };
          redrawPer();
          box.appendChild(per);
          ilist.appendChild(box);
        }
        const addItem = el(`<button type="button" style="padding:10px;border-style:dashed;border-width:2px;
          font-size:13px;font-weight:600;color:var(--ink-2)">+ 품목 추가</button>`);
        addItem.onclick = () => { data.items.push(newVendorItem(vd.id)); save(); };
        ilist.appendChild(addItem);
        body.appendChild(ilist);

        const delV = el(`<button type="button" style="width:100%;margin-top:18px;padding:10px;font-size:13px;
          font-weight:600;color:var(--danger);border-color:var(--danger-b);border-width:2px">이 거래처 지우기</button>`);
        delV.onclick = () => {
          const mine = data.items.filter(i => i.vendorId === vd.id).length;
          const msg = mine
            ? `${gwa(vd.name)} 등록된 품목 ${mine}개를 지웁니다. 그 품목을 쓰는 레시피는 원가가 다시 빈칸이 됩니다.`
            : `${eul(vd.name)} 지웁니다.`;
          if (!confirm(msg)) return;
          data.vendors = data.vendors.filter(x => x.id !== vd.id);
          data.items = data.items.filter(i => i.vendorId !== vd.id);
          openId = null;
          save();
        };
        body.appendChild(delV);
        card.appendChild(body);
      }
      rows.appendChild(card);
    }

    const addV = el(`<button type="button" class="btn-primary" style="padding:13px">+ 거래처 추가</button>`);
    addV.onclick = () => { const nv = newVendor(); nv.name = "새 거래처"; data.vendors.push(nv); openId = nv.id; save(); };
    rows.appendChild(addV);
    v.appendChild(sec);

    /* 입력 도움말 — 레시피 재료명을 그대로 고를 수 있게 */
    v.appendChild(el(`<datalist id="ing-names">${ingredientNames.map(n => `<option value="${esc(n)}">`).join("")}</datalist>`));
    v.appendChild(el(`<datalist id="common-units">${COMMON_UNITS.map(u => `<option value="${esc(u)}">`).join("")}</datalist>`));
  }

  draw();
}

/* ------------------------------------------------------------------ *
   원가 — 레시피 재료 × 거래처 단가
 * ------------------------------------------------------------------ */
function renderCost() {
  if (!opsGate("원가")) return;
  topbar({ title: "원가", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  const vd = loadVendors();
  let settings = loadSettings();
  let openId = null;

  // 직접 추가한 레시피에 재료·산출량이 없으면 원가를 계산할 수 없다
  // 직접 추가한 레시피에 재료·산출량이 없으면 원가를 계산할 수 없다
  const recipes = [...DATA.recipes, ...myRecipes()]
    .filter(r => r && r.yield && Array.isArray(r.ingredients));

  /* ★ 이 파일의 레시피에는 id가 없다. slug만 있다.
     r.id 로 판매가를 저장하면 prices[undefined] 한 칸을 네 메뉴가 같이 쓰고,
     하나를 펼치면 undefined === undefined 라서 전부 펼쳐진다. */
  const rkey = r => r.slug || r.id;

  function draw() {
    v.innerHTML = "";

    if (!vd.items.length) {
      v.appendChild(emptyBox("거래처에 <b>품목 단가</b>가 아직 없습니다.<br>원가는 레시피 재료 × 단가로 계산되므로 단가가 먼저 필요합니다."));
      const b = el(`<button type="button" class="nav-row btn-primary" style="margin-top:12px">
        <span><b>거래처에서 단가 넣기</b></span><span class="chev">›</span></button>`);
      b.onclick = () => go("#/vendors");
      v.appendChild(b);
      return;
    }

    const target = el(`<div class="card" style="padding:16px;margin-top:16px">
      <b style="font-size:15px">목표 원가율</b>
      <p class="muted" style="margin:5px 0 10px;line-height:1.6">카페는 보통 30% 안쪽을 봅니다.
      이 값으로 '얼마에 팔면 되는지'를 거꾸로 계산합니다.</p>
      <div class="row-in" style="align-items:center"></div></div>`);
    target.querySelector(".row-in").append(
      numIn(settings.targetCostRate, x => { settings.targetCostRate = x; saveSettings(settings); draw(); }, "30", "목표 원가율", 80),
      el(`<span class="muted">%</span>`)
    );
    v.appendChild(target);

    const rows = recipes.map(r => {
      const cost = costOfRecipe(r, vd.items, settings.excluded);
      const price = settings.prices[rkey(r)] || 0;
      return { r, cost, price, rate: costRate(cost.perUnit, price) };
    });
    const totalMissing = rows.reduce((s, x) => s + x.cost.missing, 0);

    if (totalMissing > 0) {
      const c = caveat(`단가를 못 찾은 재료가 <b>${totalMissing}개</b> 있습니다. 그 재료는 0원으로 세지 않고
        빼놨기 때문에, 아래 원가와 원가율은 <b>실제보다 낮습니다.</b>
        <button type="button" id="toVd" style="padding:0;background:none;border:0;color:inherit;
        text-decoration:underline;font-size:12px;font-weight:600">거래처에서 채우기</button>`);
      c.querySelector("#toVd").onclick = () => go("#/vendors");
      v.appendChild(c);
    }

    const sec = el(`<section class="sec" style="margin-top:16px"><div class="rows"></div></section>`);
    const list = sec.querySelector(".rows");

    for (const { r, cost, price, rate } of rows) {
      const isOpen = openId === rkey(r);
      const shaky = cost.missing > 0;
      const suggest = suggestedPrice(cost.perUnit, settings.targetCostRate);
      const card = el(`<div class="card" style="padding:14px 16px"></div>`);

      const hit = el(`<button type="button" style="display:flex;width:100%;align-items:flex-start;
        justify-content:space-between;gap:12px;text-align:left;background:none;border:0;padding:0">
        <span style="min-width:0">
          <b style="display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</b>
          <span style="display:block;font-size:12px;color:var(--ink-3);margin-top:2px">1배합 ${r.yield.amount}${esc(r.yield.unit)}
          · 재료 ${r.ingredients.length}개${shaky ? ` · <b style="color:var(--warn-t)">단가 없음 ${cost.missing}개</b>` : ""}</span>
        </span>
        <span style="flex:none;text-align:right">
          <b style="display:block;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums">${won(cost.perUnit)}원</b>
          <span style="display:block;font-size:12px;${rate === null || shaky ? "color:var(--ink-3)"
            : rate > settings.targetCostRate ? "color:var(--danger);font-weight:700" : "color:var(--ok);font-weight:700"}">${
            rate === null ? "판매가 입력" : `원가율 ${pct(cost.perUnit, price)}%`}</span>
        </span></button>`);
      hit.onclick = () => { openId = isOpen ? null : rkey(r); draw(); };
      card.appendChild(hit);

      /* 판매가 */
      const pr = el(`<div class="row-in" style="margin-top:11px;align-items:center"></div>`);
      pr.appendChild(el(`<span class="muted" style="flex:none">판매가</span>`));
      pr.appendChild(numIn(price, x => {
        settings.prices = { ...settings.prices, [rkey(r)]: x };
        saveSettings(settings);
        draw();
      }, "4500", `${r.name} 판매가`, 104));
      pr.appendChild(el(`<span class="muted">원</span>`));
      if (suggest !== null) {
        const b = el(`<button type="button" style="padding:7px 10px;font-size:12px;font-weight:600">${
          settings.targetCostRate}%로 맞추면 ${won(suggest)}원</button>`);
        b.onclick = () => { settings.prices = { ...settings.prices, [rkey(r)]: suggest }; saveSettings(settings); draw(); };
        pr.appendChild(b);
      }
      card.appendChild(pr);

      if (isOpen) {
        const body = el(`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px"></div>`);
        for (const l of cost.lines) {
          body.appendChild(moneyRow(
            `<span${l.excluded ? ' style="color:var(--ink-3)"' : ""}>${esc(l.name)}
             <span style="color:var(--ink-3)">${l.amount}${esc(l.unit)}</span>${
             l.excluded ? ' <span style="font-size:11px">안 셈</span>' : ""}</span>`,
            l.cost === null ? "—" : `${won(l.cost)}원`,
            { danger: l.cost === null }));
          if (l.problem) body.appendChild(el(`<p style="margin:0 0 6px;font-size:11px;color:var(--warn-t)">${esc(l.problem)}</p>`));
        }
        const sum = el(`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"></div>`);
        sum.appendChild(moneyRow(`1배합 (${r.yield.amount}${esc(r.yield.unit)})`, `${won(cost.total)}원`));
        sum.appendChild(moneyRow(`1${esc(r.yield.unit)}당 재료비`, `${won(cost.perUnit)}원`, { strong: true }));
        if (price > 0) sum.appendChild(moneyRow(`1${esc(r.yield.unit)} 팔면 남는 것 (재료비만 뺀 값)`, `${won(price - cost.perUnit)}원`));
        body.appendChild(sum);

        if (r.slug) {
          const b = el(`<button type="button" style="margin-top:11px;padding:0;background:none;border:0;
            color:var(--accent);font-size:13px;font-weight:600;text-decoration:underline">레시피 보기 ›</button>`);
          b.onclick = () => go(`#/recipe/${r.slug}`);
          body.appendChild(b);
        }
        card.appendChild(body);
      }
      list.appendChild(card);
    }
    v.appendChild(sec);

    const c = caveat(`여기 원가는 <b>재료비만</b>입니다. 인건비·임대료·공과금·카드수수료·로스(버리는 양)가
      들어 있지 않습니다. 실제로 남는 돈은 <button type="button" id="toS" style="padding:0;background:none;
      border:0;color:inherit;text-decoration:underline;font-size:12px;font-weight:600">매출 화면</button>에서
      인건비까지 빼고 봅니다.`);
    c.querySelector("#toS").onclick = () => go("#/sales");
    v.appendChild(c);
  }

  draw();
}

/* ------------------------------------------------------------------ *
   발주 체크 — 화면 순서가 곧 아침 순서다
 * ------------------------------------------------------------------ */
function renderOrder() {
  topbar({ title: "발주", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  const vd = loadVendors();
  let log = loadOrderLog();
  let links = loadOrderLinks();
  const now = new Date();
  /* ★ 달력 날짜가 아니라 영업일. 마감조가 23:50 에 "주문함"을 찍고 00:10 에
     고치려 하면 달력 날짜로는 다른 키라 빈 상태를 본다. 체크리스트와 같은 규칙. */
  const td = bizDay();

  /* 프렙의 발주 항목을 그대로 쓴다. 새 목록을 만들지 않는다.
     ★ 이 파일의 시드에는 kind 필드가 없다(축약 스키마). "주문하면 며칠 뒤 온다"가
       적힌 항목이 곧 발주 항목이고, 기존 프렙 화면도 같은 기준을 쓴다(t.days != null). */
  const tasks = DATA.prepLists.flatMap(l => l.tasks.filter(t => t.days != null).map(task => ({ list: l, task })));
  const taskById = new Map(tasks.map(({ task }) => [task.id, task]));

  /* 기준을 영업일 문자열로 잡고 거기서 뺀다. now 에서 빼면 자정 직후 창이 하루 밀린다 */
  const past = [];
  { const base = new Date(td + "T12:00:00");
    for (let i = 1; i <= 7; i++) { const d = new Date(base.getTime()); d.setDate(d.getDate() - i);
      past.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`); } }

  function draw() {
    v.innerHTML = "";

    /* ---------- 1. 주문했는데 안 들어온 것 ----------
       이걸 모르고 영업을 열면 점심때 재료가 없다. 종이가 못 잡는 지점 */
    const pending = pendingOrders(log, past);
    if (pending.length) {
      const box = el(`<div class="notice red" style="margin-top:16px">
        <b>주문했는데 아직 안 들어온 것 ${pending.length}개</b>
        <p>들어왔으면 눌러서 표시해 주세요. 안 들어왔으면 거래처에 확인이 필요합니다.</p>
        <div class="stack" style="margin-top:11px"></div></div>`);
      const st = box.querySelector(".stack");
      for (const p of pending) {
        const t = taskById.get(p.taskId);
        const row = el(`<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;
          background:var(--surface);border-radius:11px;padding:9px 12px">
          <span style="min-width:0">
            <b style="display:block;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t ? t.title : p.taskId)}</b>
            <span style="font-size:11px;color:var(--ink-3)">${esc(p.date)} 주문${p.memo ? ` · ${esc(p.memo)}` : ""}</span>
          </span></div>`);
        const b = el(`<button type="button" style="flex:none;padding:7px 11px;font-size:13px;font-weight:600">들어왔음</button>`);
        b.onclick = () => { log = putOrderState(log, p.date, p.taskId, { received: true }); saveOrderLog(log); draw(); };
        row.appendChild(b);
        st.appendChild(row);
      }
      v.appendChild(box);
    }

    /* ---------- 2. 오늘 주문 마감 ---------- */
    if (vd.vendors.length) {
      const card = el(`<div class="card" style="padding:14px 16px;margin-top:14px">
        <b style="font-size:15px">오늘 주문 마감</b>
        <p class="muted" style="margin:5px 0 4px">마감을 넘기면 그 주문은 다음 배송일로 밀립니다.</p>
        <div></div></div>`);
      const box = card.querySelector("div");
      const sorted = [...vd.vendors].sort((a, b) => minutesToCutoff(a, now) - minutesToCutoff(b, now));
      for (const x of sorted) {
        const left = minutesToCutoff(x, now);
        const soon = left >= 0 && left <= 60;
        const row = el(`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;
          padding:9px 0;border-top:1px solid var(--line)">
          <span style="min-width:0">
            <b style="display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</b>
            <span style="font-size:11px;color:var(--ink-3)">${esc(x.how)}${x.contact ? ` · ${esc(x.contact)}` : ""}
            · 지금 주문하면 ${esc(dayLabel(arrivalOf(x, now)))} 도착</span>
          </span>
          <span style="display:flex;align-items:center;gap:7px;flex:none">
            <span style="font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;${
              left < 0 ? "color:var(--ink-3)" : soon ? "color:var(--danger);font-weight:700" : "color:var(--ink-2)"}">${
              left < 0 ? "마감" : `${Math.floor(left/60)}시간 ${left%60}분`}</span>
          </span></div>`);
        const btns = row.querySelector("span:last-child");
        if (x.phone) btns.appendChild(el(`<a class="btn" href="tel:${esc(x.phone.replace(/[^\d+]/g, ""))}"
          style="padding:6px 10px;font-size:12px">전화</a>`));
        const send = el(`<button type="button" style="padding:6px 10px;font-size:12px;font-weight:600">발주서</button>`);
        send.onclick = () => {
          const lines = tasks.filter(({ task }) => links[task.id] === x.id)
            .map(({ task }) => ({ name: task.title, memo: orderStateOf(log, td, task.id).memo }));
          if (!lines.length) return alert(`${x.name}에 연결된 발주 항목이 없습니다. 아래에서 거래처를 골라주세요.`);
          copyText(buildOrderText(DATA.store.name, x.name, lines), "아래 발주 문구를 복사해 보내세요")
            .then(r => { if (r === "copied") alert(`${x.name} 발주 문구를 복사했습니다. ${ro(x.how)} 보내세요.`); });
        };
        btns.appendChild(send);
        box.appendChild(row);
      }
      v.appendChild(card);
    }

    /* ---------- 3. 주문할 것 ---------- */
    const sec = el(`<div class="card" style="padding:14px 16px;margin-top:14px">
      <b style="font-size:15px">주문할 것</b>
      <p class="muted" style="margin:5px 0 0;line-height:1.6">프렙 목록의 발주 항목을 그대로 가져옵니다.
      여기서 체크하면 프렙과 따로 관리하지 않아도 됩니다.</p>
      <div class="stack" style="margin-top:11px"></div></div>`);
    const st = sec.querySelector(".stack");

    if (!tasks.length) st.appendChild(emptyBox("프렙 목록에 발주 항목이 없습니다."));

    for (const { list, task } of tasks) {
      const s = orderStateOf(log, td, task.id);
      const border = s.received ? "var(--ok-b)" : s.ordered ? "var(--accent-b)" : !task.recoverable ? "var(--danger-b)" : "var(--line)";
      const bg = s.received ? "var(--ok-w)" : s.ordered ? "var(--accent-w)" : "transparent";
      const box = el(`<div style="border:2px solid ${border};background:${bg};border-radius:12px;padding:11px"></div>`);

      const top = el(`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <span style="min-width:0">
          <b style="display:block;font-size:15px">${esc(task.title)}</b>
          <span style="display:block;font-size:11px;color:var(--ink-3);margin-top:2px">${esc(list.name)}${
            task.days != null ? ` · 주문 후 ${task.days}일` : ""}</span>
          ${!task.recoverable ? `<span style="display:block;margin-top:4px;font-size:12px;font-weight:600;
            color:var(--danger)">까먹지 말고 해야 할 것 — ${esc(task.conseq || "")}</span>` : ""}
        </span>
        <span style="display:flex;gap:6px;flex:none"></span></div>`);
      const chips = top.querySelector("span:last-child");
      chips.appendChild(chip("주문함", s.ordered, () => {
        log = putOrderState(log, td, task.id, { ordered: !s.ordered }); saveOrderLog(log); draw();
      }));
      chips.appendChild(chip("들어옴", s.received, () => {
        // 들어왔으면 주문은 당연히 한 것이다
        log = putOrderState(log, td, task.id, { received: !s.received, ordered: !s.received ? true : s.ordered });
        saveOrderLog(log); draw();
      }));
      box.appendChild(top);

      const line = el(`<div class="row-in" style="margin-top:8px;align-items:center"></div>`);
      const memo = textIn(s.memo, x => { log = putOrderState(log, td, task.id, { memo: x }); saveOrderLog(log); },
        "수량 (우유 12팩)", `${task.title} 수량`, 180);
      line.appendChild(memo);
      if (vd.vendors.length) {
        const sel = el(`<select aria-label="${esc(task.title)} 거래처"><option value="">거래처 고르기</option>${
          vd.vendors.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select>`);
        sel.value = links[task.id] || "";
        sel.onchange = () => { links = { ...links, [task.id]: sel.value }; saveOrderLinks(links); };
        line.appendChild(sel);
      }
      box.appendChild(line);
      st.appendChild(box);
    }
    v.appendChild(sec);

    if (!vd.vendors.length) {
      const c = caveat(`거래처를 아직 안 넣었습니다. 넣으면 <b>마감 시각까지 남은 시간</b>과
        <b>주문하면 언제 오는지</b>가 같이 나오고, 발주 문구도 만들어 줍니다.
        <button type="button" id="toV" style="padding:0;background:none;border:0;color:inherit;
        text-decoration:underline;font-size:12px;font-weight:600">거래처 넣기</button>`);
      c.querySelector("#toV").onclick = () => go("#/vendors");
      v.appendChild(c);
    }
  }

  draw();
}

/* ------------------------------------------------------------------ *
   출퇴근 · 근태 — 근무표가 계획, 여기가 실제
 * ------------------------------------------------------------------ */
function renderAttend() {
  topbar({ title: "출퇴근 · 근태", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  const roster = store.get("roster", { staff: [], assign: {} });
  let punches = loadPunches();
  const contracts = loadContracts();
  const settings = loadSettings();
  let tab = "today";
  let monday = mondayOf(new Date());

  if (!roster.staff.length) {
    v.appendChild(emptyBox("직원이 아직 없습니다.<br>근무표에서 직원을 먼저 넣어 주세요. 출퇴근은 근무표에 잡힌 조와 비교해서 지각·결근을 봅니다."));
    const b = el(`<button type="button" class="btn-primary" style="width:100%;margin-top:12px;padding:13px">근무표로 가기</button>`);
    b.onclick = () => go("#/roster");
    v.appendChild(b);
    return;
  }

  const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const plannedOf = (id, date) => (roster.assign[id] || {})[date] || "";
  const commit = () => { savePunches(punches); draw(); };

  function draw() {
    v.innerHTML = "";
    const now = new Date();
    const td = dk(now);

    const tabs = el(`<div class="row-in" style="margin-top:14px"></div>`);
    tabs.appendChild(chip(`오늘 (${dayLabel(now)})`, tab === "today", () => { tab = "today"; draw(); }));
    tabs.appendChild(chip("이번 주 · 근태", tab === "week", () => { tab = "week"; draw(); }));
    v.appendChild(tabs);

    if (tab === "today") {
      /* ---------- 오늘 — 직원이 직접 누른다. 버튼 두 개여야 한다 ---------- */
      v.appendChild(el(`<p class="muted" style="margin:14px 0 0;line-height:1.6">지금 ${hhmm(now)} ·
        버튼을 누르면 그 시각으로 찍힙니다. 잘못 찍었으면 시각을 직접 고칠 수 있습니다.</p>`));
      const stack = el(`<div class="stack" style="margin-top:12px"></div>`);

      // 오늘 근무표에 잡힌 사람을 위로
      const ordered = [...roster.staff].sort((a, b) =>
        (plannedOf(a.id, td) ? 0 : 1) - (plannedOf(b.id, td) ? 0 : 1));

      for (const s of ordered) {
        const planned = plannedOf(s.id, td);
        const p = getPunch(punches, s.id, td);
        const r = judgeDay(td, planned, p, DATA.shifts);
        const tone = r.status === "지각" ? "background:var(--danger-w);color:var(--danger)"
          : r.status === "결근" ? "background:var(--sunken);color:var(--ink-2)"
          : r.status === "근무중" ? "background:var(--accent-w);color:var(--accent)"
          : r.status === "정상" ? "background:var(--ok-w);color:var(--ok)"
          : "background:var(--sunken);color:var(--ink-3)";

        const card = el(`<div class="card" style="padding:14px 16px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
            <span style="min-width:0">
              <b style="font-size:16px">${esc(s.name)}
                <span style="font-weight:400;font-size:12px;color:var(--ink-3);margin-left:6px">${esc(s.section)}</span></b>
              <span style="display:block;font-size:12px;color:var(--ink-3);margin-top:2px">${
                planned ? `근무표: ${esc(planned)}` : "근무표: 휴무"}</span>
            </span>
            <span style="flex:none;border-radius:9px;padding:4px 9px;font-size:12px;font-weight:700;${tone}">${esc(r.status)}</span>
          </div></div>`);

        const btns = el(`<div class="grid2" style="margin-top:12px"></div>`);
        const bIn = el(`<button type="button" style="padding:15px;font-size:15px;font-weight:700;${
          p && p.inAt ? "color:var(--ink-3)" : "background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-fill-t)"}">${
          p && p.inAt ? `출근 ${esc(p.inAt)}` : "출근"}</button>`);
        bIn.onclick = () => {
          const cur = getPunch(punches, s.id, td) || newPunch(s.id, td);
          punches = putPunch(punches, { ...cur, inAt: hhmm(new Date()) });
          commit();
        };
        const canOut = !!(p && p.inAt);
        const bOut = el(`<button type="button" ${canOut ? "" : "disabled"} style="padding:15px;font-size:15px;font-weight:700;${
          !canOut ? "color:var(--ink-3);opacity:.5" : p.outAt ? "color:var(--ink-3)"
          : "background:var(--ink);border-color:var(--ink);color:var(--surface)"}">${
          p && p.outAt ? `퇴근 ${esc(p.outAt)}` : "퇴근"}</button>`);
        bOut.onclick = () => {
          const cur = getPunch(punches, s.id, td) || newPunch(s.id, td);
          punches = putPunch(punches, { ...cur, outAt: hhmm(new Date()) });
          commit();
        };
        btns.append(bIn, bOut);
        card.appendChild(btns);

        if (p && p.inAt) {
          const edit = el(`<div class="row-in" style="margin-top:12px;align-items:flex-end"></div>`);
          const mk = (lbl, val, key, ph) => {
            const w = el(`<label style="display:flex;align-items:center;gap:6px">
              <span class="muted">${lbl}</span></label>`);
            const i = el(`<input placeholder="${ph}" aria-label="${esc(s.name + " " + lbl)}"
              style="width:84px;text-align:center;font-family:var(--mono)">`);
            i.value = val || "";
            i.oninput = () => {
              const cur = getPunch(punches, s.id, td) || newPunch(s.id, td);
              punches = putPunch(punches, { ...cur, [key]: i.value });
              savePunches(punches);
            };
            i.onblur = draw;
            w.appendChild(i);
            return w;
          };
          edit.appendChild(mk("출근", p.inAt, "inAt", "07:30"));
          edit.appendChild(mk("퇴근", p.outAt, "outAt", "15:30"));
          const bw = el(`<label style="display:flex;align-items:center;gap:6px"><span class="muted">휴게</span></label>`);
          const bi = numIn(p.breakMin, x => {
            const cur = getPunch(punches, s.id, td) || newPunch(s.id, td);
            punches = putPunch(punches, { ...cur, breakMin: x });
            savePunches(punches);
          }, "0", `${s.name} 휴게시간`, 66);
          bi.onblur = draw;
          bw.append(bi, el(`<span class="muted">분</span>`));
          edit.appendChild(bw);
          card.appendChild(edit);
        }

        if (r.lateMin > 0) {
          const sh = DATA.shifts.find(x => x.name === r.planned);
          card.appendChild(el(`<p style="margin:10px 0 0;font-size:13px;font-weight:600;color:var(--danger)">
            근무표(${esc(r.planned)}${sh ? " " + esc(sh.start) : ""})보다 ${hoursLabel(r.lateMin)} 늦게 찍혔습니다</p>`));
        }
        if (r.workedMin !== null) {
          card.appendChild(el(`<p style="margin:8px 0 0;font-size:13px;font-weight:600">실근로 ${hoursLabel(r.workedMin)}${
            r.overtimeMin > 0 ? ` <span style="color:var(--accent)">· 연장 ${hoursLabel(r.overtimeMin)}</span>` : ""}</p>`));
        }
        if (r.breakShort) {
          card.appendChild(el(`<p style="margin:9px 0 0;background:var(--warn-w);color:var(--warn-t);border-radius:11px;
            padding:9px 11px;font-size:12px;line-height:1.6">휴게시간이 법에서 정한 만큼보다 짧습니다.
            근로기준법 제54조 — 4시간 근무에 30분, 8시간 근무에 1시간 이상을 주어야 합니다.</p>`));
        }
        stack.appendChild(card);
      }
      v.appendChild(stack);
      return;
    }

    /* ---------- 이번 주 — 사장님이 본다 ---------- */
    const days = weekDays(monday);
    const bar = el(`<div class="card" style="padding:9px 12px;margin-top:14px;display:flex;align-items:center;gap:8px">
      <button type="button" id="pv" style="padding:7px 11px;font-size:13px;font-weight:600">‹ 지난주</button>
      <b style="flex:1;text-align:center;font-family:var(--mono);font-size:13px">${esc(dayLabel(days[0]))} ~ ${esc(dayLabel(days[6]))}</b>
      <button type="button" id="nx" style="padding:7px 11px;font-size:13px;font-weight:600">다음주 ›</button></div>`);
    bar.querySelector("#pv").onclick = () => { const d = new Date(monday); d.setDate(d.getDate()-7); monday = d; draw(); };
    bar.querySelector("#nx").onclick = () => { const d = new Date(monday); d.setDate(d.getDate()+7); monday = d; draw(); };
    v.appendChild(bar);

    const weekly = roster.staff.map(s => {
      const results = days.map(d => judgeDay(dk(d), plannedOf(s.id, dk(d)), getPunch(punches, s.id, dk(d)), DATA.shifts));
      const c = contractOf(contracts, s.id);
      return { s, results, c, pay: estimatePay(results, {
        hourlyWage: c ? c.hourlyWage : 0, fiveOrMore: settings.fiveOrMore,
        contractWeeklyHours: c ? c.weeklyHours : null }) };
    });

    // 시급·인건비는 사장님만. 출퇴근 화면 자체는 잠글 수 없다
    const money = ownerOpen();

    const tw = el(`<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr>
      <th class="sticky-col" style="text-align:left" scope="col">직원</th>
      ${days.map(d => `<th scope="col">${d.getMonth()+1}/${d.getDate()}</th>`).join("")}
      <th style="text-align:right" scope="col">근로</th>
      ${money ? '<th style="text-align:right" scope="col">인건비(추정)</th>' : ""}
      </tr></thead><tbody></tbody></table></div>`);
    const tb = tw.querySelector("tbody");

    for (const { s, results, c, pay } of weekly) {
      const cells = results.map(r =>
        r.status === "휴무" ? `<td style="text-align:center;color:var(--line)">·</td>`
        : r.status === "결근" ? `<td style="text-align:center;color:var(--danger);font-weight:700">결</td>`
        : r.workedMin === null ? `<td style="text-align:center;color:var(--accent)">중</td>`
        : `<td style="text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;${
            r.lateMin > 0 ? "color:var(--danger)" : ""}">${(r.workedMin/60).toFixed(1)}</td>`).join("");
      tb.appendChild(el(`<tr>
        <th class="sticky-col" scope="row"><b>${esc(s.name)}</b>${money
          ? `<span style="display:block;font-size:11px;color:var(--ink-3)">${
              c && c.hourlyWage > 0 ? `${won(c.hourlyWage)}원/시` : "시급 없음"}</span>` : ""}</th>
        ${cells}
        <td style="text-align:right;font-family:var(--mono)">${hoursLabel(pay.workedMin)}${
          pay.overtimeMin > 0 ? `<span style="display:block;font-size:11px;color:var(--accent)">연장 ${hoursLabel(pay.overtimeMin)}</span>` : ""}</td>
        ${money ? `<td style="text-align:right;font-family:var(--mono);font-weight:700">${
          c && c.hourlyWage > 0 ? `${won(pay.total)}원` : "—"}${
          pay.holidayPay > 0 ? `<span style="display:block;font-size:11px;font-weight:400;color:var(--ink-3)">주휴 ${won(pay.holidayPay)}</span>` : ""}</td>` : ""}
      </tr>`));
    }
    v.appendChild(tw);

    if (!money) {
      const box = el(`<div style="border:2px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;margin-top:14px">
        <b style="font-size:13px">🔒 시급과 인건비는 사장님만 봅니다</b>
        <p class="muted" style="margin:4px 0 10px">사장님 잠금번호가 필요합니다.</p>
        <div class="row-in" style="justify-content:center"></div></div>`);
      const row = box.querySelector(".row-in");
      const inp = el(`<input type="password" inputmode="numeric" autocomplete="current-password"
        placeholder="잠금번호" aria-label="잠금번호" style="width:150px">`);
      const b = el(`<button type="button" style="padding:9px 14px;font-weight:600">열기</button>`);
      const tryOpen = () => { if (checkOwnerPin(inp.value)) { unlockOwner(); draw(); } else alert("번호가 맞지 않습니다."); };
      inp.onkeydown = e => { if (e.key === "Enter") tryOpen(); };
      b.onclick = tryOpen;
      row.append(inp, b);
      v.appendChild(box);
      return;
    }

    const sum = el(`<div class="card" style="padding:14px 16px;margin-top:14px">
      <b style="font-size:15px">이번 주 합계</b><div style="margin-top:6px"></div></div>`);
    const sb = sum.querySelector("div");
    sb.appendChild(moneyRow("총 근로시간", hoursLabel(weekly.reduce((a, w) => a + w.pay.workedMin, 0))));
    sb.appendChild(moneyRow("연장", hoursLabel(weekly.reduce((a, w) => a + w.pay.overtimeMin, 0))));
    sb.appendChild(moneyRow("인건비 (추정)", `${won(weekly.reduce((a, w) => a + w.pay.total, 0))}원`, { strong: true }));
    v.appendChild(sum);

    const noWage = weekly.filter(w => !w.c || w.c.hourlyWage <= 0);
    if (noWage.length) {
      const c = caveat(`시급이 없는 직원이 <b>${noWage.length}명</b>(${esc(noWage.map(w => w.s.name).join(", "))})
        있어서 인건비 합계가 실제보다 적습니다.
        <button type="button" id="toC" style="padding:0;background:none;border:0;color:inherit;
        text-decoration:underline;font-size:12px;font-weight:600">근로계약서에서 시급 넣기</button>`);
      c.querySelector("#toC").onclick = () => go("#/contracts");
      v.appendChild(c);
    }

    const cav = caveat(`여기 금액은 <b>추정</b>입니다. 4대보험·소득세·수습 감액·연차수당이 들어 있지 않고,
      ${settings.fiveOrMore ? "5인 이상" : "5인 미만"} 기준으로 연장 가산을
      ${settings.fiveOrMore ? "적용했습니다" : "적용하지 않았습니다"}(근로기준법 제11조·제56조).
      <b>급여 대장으로 쓰지 마세요.</b>
      <button type="button" id="toC2" style="padding:0;background:none;border:0;color:inherit;
      text-decoration:underline;font-size:12px;font-weight:600">사업장 규모 설정</button>`);
    cav.querySelector("#toC2").onclick = () => go("#/contracts");
    v.appendChild(cav);
  }

  draw();
}

/* ------------------------------------------------------------------ *
   매출 — 이 화면의 존재 이유는 빼기 하나다
 * ------------------------------------------------------------------ */
function renderSales() {
  if (!opsGate("매출")) return;
  topbar({ title: "매출", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  let sales = loadSales();
  const roster = store.get("roster", { staff: [], assign: {} });
  const punches = loadPunches();
  const contracts = loadContracts();
  const settings = loadSettings();
  let tab = "day";
  let pick = today();

  const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

  /** 그날 인건비 — 출퇴근 × 시급. 사장님에게 안 물어본다 */
  function laborOn(date) {
    let cost = 0, minutes = 0;
    const noWage = [];
    for (const s of roster.staff) {
      const r = judgeDay(date, (roster.assign[s.id] || {})[date] || "", getPunch(punches, s.id, date), DATA.shifts);
      if (!(r.workedMin > 0)) continue;
      minutes += r.workedMin;
      const c = contractOf(contracts, s.id);
      if (!c || c.hourlyWage <= 0) { noWage.push(s.name); continue; }
      cost += dayLaborCost(r, c.hourlyWage, settings.fiveOrMore);
    }
    return { cost, minutes, noWage };
  }

  function draw() {
    v.innerHTML = "";
    const tabs = el(`<div class="row-in" style="margin-top:14px"></div>`);
    tabs.appendChild(chip("하루", tab === "day", () => { tab = "day"; draw(); }));
    tabs.appendChild(chip("이번 주", tab === "week", () => { tab = "week"; draw(); }));
    v.appendChild(tabs);

    if (tab === "day") {
      const bar = el(`<div class="card" style="padding:9px 12px;margin-top:14px;display:flex;align-items:center;gap:8px">
        <button type="button" id="pv" style="padding:7px 11px;font-size:13px;font-weight:600">‹ 어제</button>
        <div style="flex:1;display:flex;justify-content:center"></div>
        <button type="button" id="nx" style="padding:7px 11px;font-size:13px;font-weight:600">내일 ›</button></div>`);
      const dinp = el(`<input type="date" aria-label="날짜" style="font-weight:700;text-align:center">`);
      dinp.value = pick;
      dinp.onchange = () => { if (dinp.value) { pick = dinp.value; draw(); } };
      bar.querySelector("div").appendChild(dinp);
      bar.querySelector("#pv").onclick = () => { const d = new Date(pick + "T00:00:00"); d.setDate(d.getDate()-1); pick = dk(d); draw(); };
      bar.querySelector("#nx").onclick = () => {
        const d = new Date(pick + "T00:00:00"); d.setDate(d.getDate()+1);
        if (dk(d) <= today()) { pick = dk(d); draw(); }     // 아직 안 온 날은 안 넘긴다
      };
      v.appendChild(bar);

      const day = getDaySales(sales, pick);
      const patch = p => { sales = { ...sales, [pick]: { ...day, ...p, date: pick } }; saveSales(sales); };

      const inCard = el(`<div class="card" style="padding:14px 16px;margin-top:14px">
        <b style="font-size:15px">마감 입력</b>
        <p class="muted" style="margin:5px 0 11px;line-height:1.6">세 칸만 넣으면 됩니다.
        인건비는 출퇴근 기록에서 자동으로 나옵니다.</p>
        <div class="row-in"></div></div>`);
      const ir = inCard.querySelector(".row-in");
      const mk = (lbl, val, key, ph, suffix) => {
        const w = el(`<div class="field" style="flex:1;min-width:132px"><label>${lbl}</label>
          <div style="display:flex;align-items:center;gap:5px"></div></div>`);
        const box = w.querySelector("div");
        const i = numIn(val, x => { patch({ [key]: x }); redraw(); }, ph, lbl);
        i.style.flex = "1";
        box.append(i, el(`<span class="muted" style="flex:none">${suffix}</span>`));
        return w;
      };
      ir.append(
        mk("총매출", day.total, "total", "1250000", "원"),
        mk("결제 건수", day.count, "count", "180", "건"),
        mk("재료비 (발주 금액)", day.material, "material", "350000", "원")
      );
      v.appendChild(inCard);

      const out = el(`<div></div>`);
      v.appendChild(out);

      function redraw() {
        out.innerHTML = "";
        const d2 = getDaySales(sales, pick);
        const lb = laborOn(pick);
        const p = profitOf(d2, lb.cost);
        const box = el(`<div style="border:2px solid ${p.left >= 0 ? "var(--ok-b)" : "var(--danger-b)"};
          background:${p.left >= 0 ? "var(--ok-w)" : "var(--danger-w)"};border-radius:var(--r);padding:16px;margin-top:14px">
          <b style="font-size:15px">${esc(dayLabel(new Date(pick + "T00:00:00")))} 남은 돈</b>
          <p style="margin:5px 0 0;font-family:var(--mono);font-size:31px;font-weight:700;
            font-variant-numeric:tabular-nums">${won(p.left)}<span style="font-size:16px">원</span></p>
          <div style="margin-top:11px;border-top:1px solid rgba(0,0,0,.08);padding-top:5px"></div></div>`);
        const bd = box.querySelector("div");
        bd.appendChild(moneyRow("매출", `${won(p.sales)}원`));
        bd.appendChild(moneyRow(`재료비 ${d2.total > 0 ? `(${pct(p.material, p.sales)}%)` : ""}`, `− ${won(p.material)}원`));
        bd.appendChild(moneyRow(`인건비 ${d2.total > 0 ? `(${pct(p.labor, p.sales)}%)` : ""}
          <span style="color:var(--ink-3)">${hoursLabel(lb.minutes)}</span>`, `− ${won(p.labor)}원`));
        if (p.perCustomer !== null) bd.appendChild(moneyRow("객단가", `${won(p.perCustomer)}원`));
        out.appendChild(box);

        if (lb.noWage.length) {
          const c = caveat(`시급이 없는 직원(<b>${esc(lb.noWage.join(", "))}</b>)이 근무한 날입니다.
            그만큼 인건비가 실제보다 적고, 남은 돈은 실제보다 많게 보입니다.
            <button type="button" id="tc" style="padding:0;background:none;border:0;color:inherit;
            text-decoration:underline;font-size:12px;font-weight:600">시급 넣기</button>`);
          c.querySelector("#tc").onclick = () => go("#/contracts");
          out.appendChild(c);
        }
        if (lb.minutes === 0 && d2.total > 0) {
          const c = caveat(`이 날 출퇴근 기록이 없어서 인건비가 0원으로 잡혔습니다.
            <button type="button" id="ta" style="padding:0;background:none;border:0;color:inherit;
            text-decoration:underline;font-size:12px;font-weight:600">출퇴근 기록 넣기</button>`);
          c.querySelector("#ta").onclick = () => go("#/attend");
          out.appendChild(c);
        }

        const nf = field("메모", textIn(d2.note, x => patch({ note: x }),
          "비, 근처 행사, 기계 고장 등 — 나중에 왜 그랬는지 알려면 필요합니다", "메모"));
        nf.style.marginTop = "14px";
        out.appendChild(nf);
      }
      redraw();

    } else {
      /* ---------- 이번 주 ---------- */
      const monday = mondayOf(new Date(pick + "T00:00:00"));
      const week = weekDays(monday);
      const dates = week.map(dk);
      const wSum = sumRange(sales, dates);
      const wLabor = dates.reduce((s, d) => s + laborOn(d).cost, 0);
      const wp = profitOf(wSum, wLabor);

      const card = el(`<div class="card" style="padding:14px 16px;margin-top:14px">
        <b style="font-size:15px">${esc(dayLabel(week[0]))} ~ ${esc(dayLabel(week[6]))}</b>
        <div style="margin-top:6px"></div></div>`);
      const bd = card.querySelector("div");
      bd.appendChild(moneyRow("매출", `${won(wp.sales)}원`));
      bd.appendChild(moneyRow(`재료비 (${pct(wp.material, wp.sales)}%)`, `− ${won(wp.material)}원`));
      bd.appendChild(moneyRow(`인건비 (${pct(wp.labor, wp.sales)}%)`, `− ${won(wp.labor)}원`));
      bd.appendChild(moneyRow("남은 돈", `${won(wp.left)}원`, { strong: true }));
      if (wp.perCustomer !== null) bd.appendChild(moneyRow("객단가", `${won(wp.perCustomer)}원`));
      v.appendChild(card);

      const tw = el(`<div class="tbl-wrap" style="margin-top:12px"><table><thead><tr>
        <th style="text-align:left" scope="col">날짜</th><th style="text-align:right" scope="col">매출</th>
        <th style="text-align:right" scope="col">재료비</th><th style="text-align:right" scope="col">인건비</th>
        <th style="text-align:right" scope="col">남은 돈</th></tr></thead><tbody></tbody></table></div>`);
      const tb = tw.querySelector("tbody");
      for (const d of week) {
        const date = dk(d);
        const row = getDaySales(sales, date);
        const lb = laborOn(date);
        const pr = profitOf(row, lb.cost);
        const empty = row.total === 0 && lb.cost === 0;
        const tr = el(`<tr style="cursor:pointer">
          <td><b>${esc(dayLabel(d))}</b></td>
          <td style="text-align:right;font-family:var(--mono)">${empty ? "—" : won(row.total)}</td>
          <td style="text-align:right;font-family:var(--mono)">${empty ? "—" : won(row.material)}</td>
          <td style="text-align:right;font-family:var(--mono)">${empty ? "—" : won(lb.cost)}</td>
          <td style="text-align:right;font-family:var(--mono);font-weight:700;${
            !empty && pr.left < 0 ? "color:var(--danger)" : ""}">${empty ? "—" : won(pr.left)}</td></tr>`);
        tr.onclick = () => { pick = date; tab = "day"; draw(); };
        tb.appendChild(tr);
      }
      v.appendChild(tw);
    }

    const c = caveat(`<b>"남은 돈"은 순이익이 아닙니다.</b> 임대료·공과금·카드수수료·세금·감가상각이
      빠져 있습니다. 재료비도 그날 발주 금액이라 실제로 쓴 양과는 다릅니다(로스·재고 변동).
      메뉴별 재료비는 <button type="button" id="tk" style="padding:0;background:none;border:0;color:inherit;
      text-decoration:underline;font-size:12px;font-weight:600">원가 화면</button>에서 봅니다.`);
    c.querySelector("#tk").onclick = () => go("#/cost");
    v.appendChild(c);
  }

  draw();
}

/* ------------------------------------------------------------------ *
   근로계약서 — 조건과 의무만 추적한다 (원본 보관 안 함)
 * ------------------------------------------------------------------ */
function renderContracts() {
  if (!opsGate("근로계약서")) return;
  topbar({ title: "근로계약서", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  const roster = store.get("roster", { staff: [], assign: {} });
  let list = loadContracts();
  let settings = loadSettings();
  let openId = null;

  const save = () => { saveContracts(list); draw(); };
  const saveQuiet = () => saveContracts(list);

  function draw() {
    v.innerHTML = "";

    /* ---------- 사업장 설정 ---------- */
    const set = el(`<div class="card" style="padding:14px 16px;margin-top:16px">
      <b style="font-size:15px">사업장 설정</b>
      <p class="muted" style="margin:5px 0 11px">이 두 값이 경고와 인건비 계산을 좌우합니다.</p>
      <div class="row-in" style="gap:18px;align-items:flex-start"></div></div>`);
    const sr = set.querySelector(".row-in");

    const wageBox = el(`<div class="field"><label>최저임금 시급</label>
      <div style="display:flex;align-items:center;gap:5px"></div>
      <span class="muted" style="font-size:11px">2026년 적용액 10,320원</span></div>`);
    wageBox.querySelector("div").append(
      numIn(settings.minWage, x => { settings.minWage = x; saveSettings(settings); draw(); }, "10320", "최저임금 시급", 92),
      el(`<span class="muted">원</span>`));
    sr.appendChild(wageBox);

    const sizeBox = el(`<div class="field"><label>상시 근로자</label>
      <div class="row-in"></div>
      <span class="muted" style="font-size:11px">5인 미만은 연장 가산수당이 없습니다 (근로기준법 제11조)</span></div>`);
    const sb = sizeBox.querySelector(".row-in");
    sb.appendChild(chip("5인 미만", !settings.fiveOrMore, () => { settings.fiveOrMore = false; saveSettings(settings); draw(); }));
    sb.appendChild(chip("5인 이상", settings.fiveOrMore, () => { settings.fiveOrMore = true; saveSettings(settings); draw(); }));
    sr.appendChild(sizeBox);
    v.appendChild(set);

    if (!roster.staff.length) {
      v.appendChild(emptyBox("직원이 없습니다. 근무표에서 직원을 먼저 넣어 주세요."));
      const b = el(`<button type="button" class="btn-primary" style="width:100%;margin-top:12px;padding:13px">근무표로 가기</button>`);
      b.onclick = () => go("#/roster");
      v.appendChild(b);
      return;
    }

    /* ---------- 계약 정보가 없는 직원 ---------- */
    const missing = roster.staff.filter(s => !contractOf(list, s.id));
    if (missing.length) {
      const box = el(`<div class="notice red" style="margin-top:14px">
        <b>계약 정보가 없는 직원 ${missing.length}명</b>
        <p>근로계약서는 일을 시작하기 전에 서면으로 만들어 <b>한 부를 줘야</b> 합니다.
        안 주면 500만원 이하 벌금입니다 (근로기준법 제17조).</p>
        <div class="row-in" style="margin-top:11px"></div></div>`);

/* ---------- 촬영 ------------------------------------------------- */

/** 「묶음 머리」 id — 할 일이 아니라 **이름표**인 카드.
 *  Next 앱 `src/lib/repo.ts` 의 `headerIds()` 와 같은 규칙이어야 한다. */
function prepHeadIds(list) {
  const kids = {};
  list.tasks.forEach(t => { if (t.option) (kids[t.option] = kids[t.option] || []).push(t); });
  return Object.keys(kids).filter(id => kids[id].some(k => !k.optional));
}

/** 찍을 수 있는 프렙 항목.
 *
 *  ★ 진행률(`countedTasks`)과 **분모가 다르다. 일부러다.**
 *    옵션은 **센다** — 르방 갱신은 실제로 찍을 수 있는 일이고, 르방을 쓰는
 *    매장에서는 오히려 기준이 가장 안 맞는 항목이다.
 *    묶음 머리는 **뺀다** — `기계 · 설비 점검` 은 이름표라 찍을 장면이 없다.
 *
 *  Next 앱의 `filmableTasks()` 와 같은 규칙. 두 앱 합계가 똑같이 85 다. */
function filmableTasks(list) {
  const heads = prepHeadIds(list);
  return list.tasks.filter(t => heads.indexOf(t.id) < 0);
}

/** 기준이 사람마다 가장 갈리는 넷. `docs/day-flow.md` 의 「영상으로 박제할 1순위」.
 *
 *  ★ Next 앱은 항목 id 로 짚지만 여기서는 그럴 수 없다 — 단일 파일의 레시피
 *    순서에는 id 가 없고, 프렙 id 는 하이픈이 빠져 있다(`p-1` → `p1`,
 *    `tests/twoApps.test.ts` 의 `flatId`). 그래서 **화면에 보이는 것**으로 짚는다. */
const SHOOT_FIRST = {
  "t-open-5": "추출 테스트 합격 기준",
  "t-bake-1": "르방 · 발효 완료 판단",
  "스팀 — 온도와 거품": "스팀 밀크 온도 · 거품",
  "p1": "콜드브루 거는 장면"
};

/** 찍어야 할 것 전부 — 포지션 스텝 26 + 레시피 순서 32 + 프렙 27 = 85. */
function shootItems() {
  const out = [];
  DATA.positions.forEach(p => p.sections.forEach(s => s.steps.forEach(st =>
    out.push({ key: st.id, title: st.title, group: p.name + " · 포지션", critical: !!st.critical }))));
  DATA.recipes.forEach(r => (r.steps || []).forEach(st =>
    out.push({ key: st.title, title: st.title, group: r.name + " · 레시피", critical: !!st.critical })));
  DATA.prepLists.forEach(l => filmableTasks(l).forEach(t =>
    out.push({ key: t.id, title: t.title, group: l.name + " · 프렙", critical: !!t.critical })));
  return out;
}

function renderShoot() {
  topbar({ title: "촬영 진행", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  const items = shootItems();

  /* ★ 이 화면은 원본 앱의 촬영 보드와 **하는 일이 다르다.** 거기서는 파일명을
     복사해 `public/media/` 에 넣지만, 이 파일에는 넣을 폴더가 없다(파일 하나다).
     그래서 **무엇을 찍어야 하는지만** 보여주고, 넣는 것은 원본에서 한다고
     화면이 먼저 말한다. 여기서 파일명을 흉내 내면 시연에서만 되는 것이 된다. */
  v.appendChild(el(`<div class="card" style="padding:16px;margin-top:18px">
    <p class="eyebrow" style="margin:0">${items.length}개를 찍어야 합니다</p>
    <p style="margin:4px 0 0;font-size:13px;line-height:1.7;color:var(--ink-2)">
      포지션 순서 <b>26</b> · 레시피 순서 <b>32</b> · 프렙 <b>27</b>.
      프렙 30개 중 셋은 <b>이름표</b>라 찍을 장면이 없어 뺐습니다.</p>
    <p style="margin:9px 0 0;background:var(--sunken);border-radius:11px;padding:10px 12px;

      넣을 폴더가 없습니다. 찍은 것을 넣는 일은 <b>원본 앱의 촬영 화면</b>에서 합니다 —
      거기서는 항목마다 파일 이름이 나오고, 그 이름으로 저장해 폴더에 넣으면 붙습니다.</p>
  </div>`));

  const first = items.filter(i => SHOOT_FIRST[i.key]);
  if (first.length) {
    const sec = el(`<section class="sec"><h2>먼저 찍을 것</h2>
      <p class="hint">기준이 사람마다 가장 갈리는 항목입니다. 이것만 있어도 발표는 됩니다.</p>
      <div class="rows"></div></section>`);
    first.forEach(i => sec.querySelector(".rows").appendChild(el(
      `<div class="card" style="padding:12px 14px">
        <b style="font-size:14px">${esc(SHOOT_FIRST[i.key])}</b>
        <span class="meta" style="display:block;font-size:12px;color:var(--ink-3);margin-top:2px">${esc(i.group)} · ${esc(i.title)}</span>
      </div>`)));
    v.appendChild(sec);
  }

  /* 그룹별 — 찍으러 다닐 때 한 자리에서 끝나도록 묶는다 */
  const groups = [];
  items.forEach(i => {
    const g = groups.find(x => x.name === i.group);
    (g ? g.items : (groups.push({ name: i.group, items: [] }), groups[groups.length - 1].items)).push(i);
  });
  groups.forEach(g => {
    const sec = el(`<section class="sec"><h2>${esc(g.name)}</h2>
      <p class="hint">${g.items.length}개</p><div class="rows"></div></section>`);
    g.items.forEach(i => sec.querySelector(".rows").appendChild(el(
      `<div class="nav-row" style="cursor:default"><span><b>${esc(i.title)}</b>${
        i.critical ? ` <span style="font-size:11px;font-weight:700;color:var(--danger)">꼭 지키기</span>` : ""
      }</span></div>`)));
    v.appendChild(sec);
  });

  v.appendChild(caveat(`<b>지금 실제로 찍은 것은 0장입니다.</b> 배관은 원본 앱에 다 돼 있고
    비어 있는 것은 내용입니다. 좋은 예가 한 장만 있어도 그 항목에 붙고, 나쁜 예는 없으면
    안 보입니다 — <b>완벽하게 찍을 필요가 없다</b>는 뜻입니다.`));
}

/* ---------- 내보내기 --------------------------------------------- */

/** ★ 칸이 `= + - @` 로 시작하면 앞에 `'` 를 붙인다. 안 붙이면 엑셀·구글시트가
 *  **수식으로 실행한다.** 직원이 메모를 손으로 넣는 칸이 있어서 실제로 걸리는
 *  경로다. Next 앱 `src/lib/backup.ts` 의 `csvSafe()` 와 같은 규칙. */
function csvSafe(v) { return /^[=+\-@]/.test(v) ? "'" + v : v; }
function csvCell(v) {
  const s = csvSafe(v == null ? "" : String(v));
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/** ★ 맨 앞의 BOM 을 지우지 말 것. 없으면 **엑셀이 UTF-8 을 못 알아보고 한글이
 *  전부 깨진다.** 사장님이 "안 된다" 고 판단하는 가장 흔한 지점이다. */
function toCsv(rows) {
  return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n") + "\r\n";
}

/** 파일로 내려받기. 파일(`file://`)로 열면 막는 브라우저가 있어서
 *  **되면 받고, 안 되면 내용을 화면에 펴서 복사하게 한다.** 조용히 실패하면
 *  사장님은 눌렀는데 아무 일도 안 일어난 것으로 보인다. */
function saveFile(name, text, mime) {
  try {
    const a = document.createElement("a");
    const url = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch {} }, 1000);
    return true;
  } catch { return false; }
}

/** 내보낼 것 — `store` 가 쓰는 키 전부. 하나라도 빠지면 조용히 덜 나간다. */
const BACKUP_KEYS = ["roster", "roster:mode", "punch", "contracts", "sales",
  "vendors", "settings", "orderLog", "orderLinks", "cycleDone", "cycleEvery", "recipes:mine"];

function renderBackup() {

  const roster = store.get("roster", { staff: [] }) || { staff: [] };
  const staff = Array.isArray(roster.staff) ? roster.staff : [];
  const nameOf = id => (staff.find(s => s.id === id) || {}).name || id;

  const punches = store.get("punch", {}) || {};
  const punchRows = [];
  Object.keys(punches).forEach(sid => Object.keys(punches[sid] || {}).forEach(d => {
    const p = punches[sid][d] || {};
    punchRows.push([nameOf(sid), d, p.inAt || "", p.outAt || "", p.breakMin || 0, p.note || ""]);
  }));
  punchRows.sort((a, b) => (a[1] + a[0] < b[1] + b[0] ? -1 : 1));

  const contracts = store.get("contracts", []) || [];
  const contractRows = (Array.isArray(contracts) ? contracts : []).map(c => [
    nameOf(c.staffId), c.startDate || "", c.endDate || "", c.hourlyWage || 0,
    c.weeklyHours || 0, (c.workDays || []).map(i => WD[i]).join("·"),
    c.handedOver ? "예" : "아니오", c.insured ? "예" : "아니오", c.note || ""
  ]);

  const done = store.get("cycleDone", {}) || {};
  const every = store.get("cycleEvery", {}) || {};
  const titleOf = id => {
    for (const l of DATA.prepLists) { const t = l.tasks.find(x => x.id === id); if (t) return t.title; }
    return id;
  };
  const cycleRows = Object.keys(done).map(id => [titleOf(id), done[id] || "", every[id] || ""]);

  const stamp = bizDay();
  const files = [
    { name: `매장수첩_백업_${stamp}.json`, mime: "application/json",
      make: () => JSON.stringify({ kind: "store-note-backup", exportedAt: new Date().toISOString(),
        storeName: DATA.store.name, data: bundle }, null, 2),
      label: "전체 백업 (JSON)",
      note: "되돌릴 때 쓰는 파일입니다. 사람이 읽으라고 만든 것이 아닙니다",
      count: Object.keys(bundle).length + "가지" },
    { name: `출퇴근_${stamp}.csv`, mime: "text/csv",
      make: () => toCsv([["이름", "날짜", "출근", "퇴근", "휴게(분)", "메모"], ...punchRows]),
      label: "출퇴근 (CSV · 엑셀)", note: "3년 보관 대상입니다 (근로기준법 제42조)",
      count: punchRows.length + "건" },
    { name: `근로계약_${stamp}.csv`, mime: "text/csv",
      make: () => toCsv([["이름", "시작", "종료", "시급", "주 소정근로", "근무요일", "서면교부", "4대보험", "메모"], ...contractRows]),
      label: "근로계약 (CSV · 엑셀)", note: "주민등록번호는 애초에 담지 않습니다",
      count: contractRows.length + "건" },
    { name: `주기점검_${stamp}.csv`, mime: "text/csv",
      make: () => toCsv([["항목", "마지막으로 한 날", "주기(일)"], ...cycleRows]),
      label: "주기 점검 (CSV · 엑셀)", note: "보건증·소방처럼 기억에만 있던 것들입니다",
      count: cycleRows.length + "건" }
  ];

  const sec = el(`<section class="sec" style="margin-top:16px">
    <h2>태블릿을 잃으면 같이 사라집니다</h2>
    <p class="hint">출퇴근과 계약은 <b>3년 보관</b>해야 합니다. 한 달에 한 번 받아두세요.
      <b>CSV 는 엑셀로 열어 보관·제출용</b>, <b>JSON 은 되돌리기용</b>입니다.</p>
    <div class="rows"></div></section>`);
  const rows = sec.querySelector(".rows");
  v.appendChild(sec);

  files.forEach(f => {
    const b = el(`<button type="button" class="nav-row"><span>
      <b>${esc(f.label)}</b>
      <span class="meta">${esc(f.count)} · ${esc(f.note)}</span></span><span class="chev">↓</span></button>`);
    b.onclick = () => {
      const text = f.make();
      if (saveFile(f.name, text, f.mime)) { say(f.label + " 내려받았습니다"); return; }
      /* 파일로 열어서 내려받기가 막힌 경우 — 조용히 넘어가지 않는다 */
      const box = el(`<div class="card" style="padding:14px 16px">
        <b style="font-size:14px">이 브라우저에서는 바로 못 받습니다</b>
        <p class="muted" style="margin:5px 0 9px">파일로 열면 막는 브라우저가 있습니다.
          아래 내용을 복사해서 <b>${esc(f.name)}</b> 으로 저장하세요.</p></div>`);
      const ta = el(`<textarea readonly style="width:100%;height:150px;font-family:var(--mono);font-size:11px"></textarea>`);
      ta.value = text;
      box.appendChild(ta);
      b.replaceWith(box);
      ta.focus(); ta.select();
    };
    rows.appendChild(b);
  });

  /* ★ 되돌리기는 **일부러 안 넣었다.** 되돌리기는 합치지 않고 **덮어쓴다** —
     시연 도중에 잘못 누르면 화면의 데이터가 그 자리에서 사라진다.
     원본 앱에는 있고, 거기서는 확인을 두 번 받고 **잃는 건수를 그 순간 다시
     읽어서** 보여준다. 여기서 흉내만 내면 그 안전장치가 없는 채로 위험만 남는다. */
  v.appendChild(caveat(`<b>되돌리기는 이 시연 파일에 넣지 않았습니다.</b> 되돌리기는
    합치는 것이 아니라 <b>덮어쓰는 것</b>이라, 시연 중에 잘못 누르면 화면의 데이터가
    그 자리에서 사라집니다. 원본 앱에는 있고 거기서는 <b>확인을 두 번 받고, 잃게 되는
    건수를 그 순간 다시 세어</b> 보여줍니다. 그리고 되돌리기는 <b>JSON 만 받습니다</b> —
    엑셀에서 한 칸만 고쳐도 시각·요일이 깨지고 근태와 인건비가 조용히 틀어집니다.`));
}

</script>


</body>
</html>
