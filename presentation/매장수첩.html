<!-- 외부 폰트를 쓰지 않는다 (2026-09-07, V-12).
     이 파일의 존재 이유가 "발표장에 인터넷·개발환경이 없을 수 있어서"인데
     글꼴을 CDN에서 받으면 그 전제가 깨진다. 오프라인에서 서체가 바뀌면
     계량·수량 표의 열 폭과 제목 줄바꿈이 준비한 것과 달라진다.
     겸해서 방문자 IP가 Google로 나가던 것도 사라진다 —
     제출 문서의 "서버에 사용자 데이터를 저장하지 않는다"와 충돌하던 지점.
     → docs/deliverables/06_보안설계.md V-12 -->

<style>
/* ------------------------------------------------------------------ *
   매장수첩 — 단일 파일 버전
   개인 카페·베이커리 주방 기준 관리. 서버 없이 이 파일 하나로 동작한다.
 * ------------------------------------------------------------------ */

:root {
  /* 밀가루빛 웜 뉴트럴 + 가마 색 액센트 */
  --ground:   #FBF9F7;
  --surface:  #FFFFFF;
  --sunken:   #F4F0EC;
  --line:     #E7E1DA;
  --ink:      #1C1917;
  --ink-2:    #57534E;
  --ink-3:    #6E655E;   /* AA: sunken 5.02 / surface 5.70 (구 #8A817A 는 3.37~3.82 미달) */
  --accent:   #D9480F;   /* 브랜드색. theme-color 와 같아야 한다 */
  /* 작은 글씨에 쓰는 액센트. --accent 는 흰 배경에서 4.30 으로 AA 미달이다.
     14px 굵은 글씨(큰글씨 기준 3:1)까지는 --accent 를 써도 되지만,
     11~13px 본문에는 이쪽을 쓴다. surface 5.79 / sunken 5.11 */
  --accent-t: #B8390B;
  /* ★ 액센트로 꽉 채운 면(주 버튼·선택된 칩)과 그 위의 글자색.
     라이트: 원색이 흰 글씨에 4.30 으로 미달이라 92% 로 어둡게 -> 4.95
     다크:   --accent 가 밝은 주황이라 흰 글씨가 2.83 로 더 나쁘다.
             그래서 다크에서는 글자를 어둡게 뒤집는다 -> 6.58
     두 값을 쌍으로 묶어둔 이유가 이것이다. 한쪽만 고치면 반대 모드가 깨진다. */
  --accent-fill:   color-mix(in srgb, var(--accent) 92%, #000);
  --accent-fill-h: color-mix(in srgb, var(--accent) 84%, #000);
  --accent-fill-t: #fff;
  --accent-w: #FDF1EA;
  --accent-b: #F3CDB8;
  --danger:   #B4232A;
  --danger-w: #FDF0F0;
  --danger-b: #EFC3C3;
  --ok:       #1F7A44;
  --ok-w:     #EDF7F1;
  --ok-b:     #BCE0CA;
  --warn-w:   #FBF3DE;
  --warn-t:   #7A5A16;

  /* 근무표 달력의 섹션 구분색. 예전에는 JS 안에 hex 로 박혀 있어서
     다크모드에서 뒤집히지 않았다(#2563EB 가 다크 배경 대비 3.27 미달).
     칩은 자기 색 8% 틴트 위에 같은 색 글씨를 올리므로 대비가 구조적으로
     낮다 — 8% 는 전 색상이 4.5 를 넘는 최대 농도다(10% 는 4.49 로 미달). */
  --sec-1:    #B8390B;
  --sec-2:    #1F7A44;
  --sec-3:    #2563EB;
  --sec-4:    #7C3AED;
  --sec-5:    #B4232A;
  --sec-6:    #0E7490;
  /* 달력 요일 머리글·날짜. 일요일은 --danger 를 쓴다 */
  --sat:      #2563EB;

  /* 설치된 것만 쓴다. 앞에서부터 있는 것이 잡힌다 — Windows는 맑은 고딕,
     Mac은 애플 SD 산돌고딕. 둘 다 한글 기본 탑재라 발표장에서 빠질 일이 없다. */
  --sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI",
          "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  /* 숫자 열을 맞추는 건 이쪽이다. 전부 고정폭이라 tabular-nums가 그대로 산다. */
  --mono: ui-monospace, "Cascadia Mono", "Consolas", "SF Mono", Menlo,
          "D2Coding", monospace;

  --r: 14px;
  --shadow: 0 1px 2px rgba(28,25,23,.05), 0 8px 24px -16px rgba(28,25,23,.22);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:   #15120F;
    --surface:  #201C18;
    --sunken:   #2A251F;
    --line:     #38312A;
    --ink:      #F5F0EA;
    --ink-2:    #BDB4AA;
    --ink-3:    #8C837A;
    --accent:   #F2762F;
    --accent-t: #F2762F;   /* 다크는 원래 5.97 로 통과하므로 --accent 와 같다 */
    --accent-fill:   var(--accent);        /* 밝은 주황을 그대로 면색으로 */
    --accent-fill-h: color-mix(in srgb, var(--accent) 88%, #fff);
    --accent-fill-t: #15120F;              /* 글자를 어둡게. 6.58 */
    --accent-w: #34190D;
    --accent-b: #6B3417;
    --danger:   #F0757B;
    --danger-w: #351417;
    --danger-b: #6B2A2E;
    --ok:       #64C48C;
    --ok-w:     #12271B;
    --ok-b:     #2C5740;
    --warn-w:   #2E2513;
    --warn-t:   #DFC177;
    --sec-1:    #F2762F;
    --sec-2:    #3DAE69;
    --sec-3:    #5B8DEF;
    --sec-4:    #A98BF5;
    --sec-5:    #E8636A;
    --sec-6:    #37A8C4;
    --sat:      #5B8DEF;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --ground:   #15120F;
  --surface:  #201C18;
  --sunken:   #2A251F;
  --line:     #38312A;
  --ink:      #F5F0EA;
  --ink-2:    #BDB4AA;
  --ink-3:    #8C837A;
  --accent:   #F2762F;
  --accent-w: #34190D;
  --accent-b: #6B3417;
  --danger:   #F0757B;
  --danger-w: #351417;
  --danger-b: #6B2A2E;
  --ok:       #64C48C;
  --ok-w:     #12271B;
  --ok-b:     #2C5740;
  --warn-w:   #2E2513;
  --warn-t:   #DFC177;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

/* 하단 여백 108px 은 고정 탭바(≈57px) 를 피하는 값이다.
   안전영역만큼 탭바가 더 두꺼워지므로 여기도 같이 더해준다. */
.wrap { max-width: 760px; margin: 0 auto;
  padding: 0 16px calc(108px + env(safe-area-inset-bottom, 0px)); }

/* ---------- 상단 ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 760px; margin: 0 auto; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.top h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.top .sub {
  margin: 0; font-size: 11px; color: var(--ink-3);
  font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase;
}
.top .grow { flex: 1; min-width: 0; }
.top .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 버튼 ---------- */
button, .btn {
  font: inherit; color: inherit; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 9px 14px;
  transition: background .12s ease, border-color .12s ease;
}
button:hover, .btn:hover { background: var(--sunken); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn-primary {
  background: var(--accent-fill); border-color: var(--accent-fill);
  color: var(--accent-fill-t); font-weight: 600;
}
.btn-primary:hover { background: var(--accent-fill-h); border-color: var(--accent-fill-h); }
.btn-ghost { background: transparent; }
.back { padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); flex: none; }

/* ---------- 카드 ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
}
.rows { display: flex; flex-direction: column; gap: 10px; }

.opts { border-top: 1px dashed var(--line); background: var(--sunken); padding: 12px 14px; }
.sec-h { font-size: 15px; margin: 26px 0 0; padding-top: 18px; border-top: 1px solid var(--line); }
.scaler-sm { border-top: 1px solid var(--line); padding: 10px 12px; }
.steps { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.steps > summary { cursor: pointer; list-style: none; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.steps > summary::-webkit-details-marker { display: none; }
.steps .caret { display: inline-block; transition: transform .15s; }
.steps[open] .caret { transform: rotate(90deg); }
.steps .dim { font-weight: 400; color: var(--ink-3); }
.steplist { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
        border: 1px solid var(--line); border-radius: 12px; background: var(--ground); }
.step.crit { border-color: var(--danger-b); }
.stepno { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: var(--sunken);
          color: var(--ink-3); font-size: 12px; font-weight: 700; display: flex;
          align-items: center; justify-content: center; }
.step h4 { margin: 2px 0 0; font-size: 14px; }
.step p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.step .tip { margin-top: 6px; background: var(--sunken); border-radius: 8px; padding: 6px 8px; font-size: 12px; }
.slot.late { background: var(--danger-w); color: var(--danger); }
.cyc { display:flex; flex-wrap:wrap; gap:6px 14px; padding:8px 12px 2px; }
.cyc label { font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:5px; }
.cyc input { font:inherit; font-size:13px; color:var(--ink); padding:3px 6px; border:1px solid var(--line); border-radius:8px; background:var(--ground); }
.cyc input[type=number] { width:5rem; }
.scaler-sm .ing li { font-size: 13px; }
.opts-note { font-size: 11px; color: var(--ink-3); margin: 2px 0 8px; line-height: 1.5; }
.task.opt { margin: 0 0 8px; }
.task.opt:last-child { margin-bottom: 0; }
.task.opt h3 { font-size: 14px; }
.nav-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.nav-row b { font-size: 15px; }
.nav-row .meta { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.nav-row .chev { color: var(--ink-3); font-size: 18px; flex: none; }

/* .btn-primary가 위에서 정의돼 .nav-row에 덮인다. 조합 선택자로 되살린다 */
.nav-row.btn-primary {
  /* 더 구체적인 선택자라 .btn-primary 를 덮는다. 같은 토큰을 써야 한다 —
     여기만 놓쳐서 홈 화면 주 버튼이 조용히 미달로 남아 있었다. */
  background: var(--accent-fill); border-color: var(--accent-fill);
  color: var(--accent-fill-t); box-shadow: none;
}
.nav-row.btn-primary:hover { background: var(--accent-fill-h); border-color: var(--accent-fill-h); }
.nav-row.btn-primary .chev { color: var(--accent-fill-t); }

/* ---------- 라벨 ---------- */
.eyebrow {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
}
.sec { margin-top: 30px; }
.sec > h2 { margin: 0 0 3px; font-size: 15px; font-weight: 700; }
.sec > p.hint { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-3); }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px;
  background: var(--sunken); color: var(--ink-2); white-space: nowrap;
}
.pill.mono { font-family: var(--mono); font-weight: 500; letter-spacing: .02em; }
.pill.crit { background: var(--danger-w); color: var(--danger); border: 1px solid var(--danger-b); }
.pill.warn { background: var(--warn-w); color: var(--warn-t); }
.pill.new  { background: var(--accent-w); color: var(--accent); border: 1px solid var(--accent-b); }

/* ---------- 진행 ---------- */
.bar { height: 5px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.count { font-family: var(--mono); font-weight: 600; color: var(--accent); font-size: 14px; }

/* ---------- 알림 ---------- */
.notice { border-radius: var(--r); padding: 14px 16px; border: 1px solid; }
.notice.red   { background: var(--danger-w); border-color: var(--danger-b); color: var(--danger); }
.notice.green { background: var(--ok-w); border-color: var(--ok-b); color: var(--ok); }
.notice b { display: block; font-size: 15px; }
.notice p { margin: 4px 0 0; font-size: 13px; line-height: 1.55; opacity: .92; }

/* ---------- 작업 카드 ---------- */
.task { border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.task.keep { border-color: var(--danger-b); }
.task.done { opacity: .5; }
.task-hit { display: flex; gap: 12px; width: 100%; text-align: left; padding: 15px 16px; background: none; border: 0; border-radius: 0; }
.task-hit:hover { background: var(--sunken); }
.tick {
  flex: none; width: 28px; height: 28px; margin-top: 2px; border-radius: 50%;
  border: 2px solid var(--line); display: grid; place-items: center;
  color: transparent; /* 체크 전에는 표시가 보이면 안 된다 */
}
/* 체크 표시는 글자가 아니라 아이콘이지만, 다크에서 흰 글리프가 2.83 이라
   비텍스트 기준 3:1 도 못 넘는다. 같은 토큰 쌍을 쓴다. */
.task.done .tick { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-fill-t); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.task h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; }
.task.done h3 { text-decoration: line-through; }
.task .desc { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.slot {
  margin-top: 9px; padding: 8px 11px; border-radius: 9px;
  background: var(--sunken); font-size: 13px; font-weight: 600;
}
.slot b { font-family: var(--mono); }
.slot .dim { font-weight: 400; color: var(--ink-3); font-family: var(--sans); }
.conseq { margin: 9px 0 0; font-size: 13px; color: var(--ink-3); }
.task.keep .conseq { color: var(--danger); font-weight: 600; }

/* ---------- 배수 ---------- */
.scaler { border-top: 1px solid var(--line); background: var(--sunken); padding: 12px 16px; }
.scale-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
.scale-grid button { padding: 9px 0; font-family: var(--mono); font-weight: 600; font-size: 13px; }
.scale-grid button[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-fill-t); }
.yield { margin: 11px 0 6px; font-size: 12.5px; color: var(--ink-3); }
.yield b { color: var(--accent); font-family: var(--mono); }

.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 5px 0; }
.ing .nm { font-size: 14px; color: var(--ink-2); }
.ing .nt { font-size: 11px; color: var(--ink-3); font-family: var(--mono); margin-left: 6px; }
.ing .amt { font-family: var(--mono); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.ing .amt.on { color: var(--accent); }

/* ---------- 입력 ---------- */
input, select, textarea {
  font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
}
input::placeholder, textarea::placeholder { color: var(--ink-3); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.row-in { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- 표 ---------- */
/* 화면에서만 숨긴다. display:none·visibility:hidden 은 스크린리더도 건너뛴다 */
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}
/* 포커스가 와도 테두리가 화면을 흔들지 않게 */
#view:focus { outline: none; }
#view:focus-visible { outline: none; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--line); }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
/* 행 머리글을 <th scope="row"> 로 바꿨다. UA 기본 굵기가 붙으면 안쪽 보조문까지
   굵어지므로 눌러둔다 — 이름은 <b> 가 굵히므로 화면은 그대로다. */
tbody th { font-weight: 400; }
thead th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-family: var(--mono); font-weight: 500; }
td.num, th.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sticky-col { position: sticky; left: 0; background: var(--surface); min-width: 116px; }

/* ---------- 하단 탭 ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  /* viewport-fit=cover 를 켜놨으므로 홈 인디케이터 영역을 직접 비워야 한다.
     없으면 아이패드·아이폰에서 탭 6개가 인디케이터에 깔린다. */
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tabbar button {
  border: 0; border-radius: 0; background: none; padding: 9px 4px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;

  if (vendorName) out.push(`${vendorName} 담당자님, 아래와 같이 부탁드립니다.`);
  out.push("");
  for (const l of lines) out.push(`- ${l.name}${l.memo ? ` : ${l.memo}` : ""}`);
  out.push("", "확인 후 회신 부탁드립니다. 감사합니다.");

}

/* ---------- 사장님 잠금 ----------
   ⚠ 보안이 아니라 가리개다. 기기를 가진 사람이 브라우저 도구를 열면
     그대로 읽힌다. 홀 직원이 태블릿 만지다 매출·시급을 보는 것까지 막는다.
   잠금 해제는 sessionStorage에 둔다 — 브라우저를 닫으면 다시 잠긴다. */
function pinDigest(pin) {
  let h = 2166136261;
  const s = `sop-owner:${pin}`;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function hasPin() { try { return !!localStorage.getItem("ownerPin"); } catch { return false; } }
function setOwnerPin(pin) {
  if (String(pin).length < 4) return false;
  try { localStorage.setItem("ownerPin", pinDigest(pin)); unlockOwner(); return true; } catch { return false; }
}
function checkOwnerPin(pin) {
  try { const v = localStorage.getItem("ownerPin"); return !!v && v === pinDigest(pin); } catch { return false; }
}
function unlockOwner() { try { sessionStorage.setItem("ownerOpen", "1"); } catch {} }
function lockOwner() { try { sessionStorage.removeItem("ownerOpen"); } catch {} }
function ownerOpen() {
  if (!hasPin()) return true;                   // 처음 쓰는 사람을 가두지 않는다
  try { return sessionStorage.getItem("ownerOpen") === "1"; } catch { return false; }
}

function go(hash) { location.hash = hash; }
function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [name, arg] = raw.split("/");
  return { name: name || "", arg: arg || "" };
}

/**
 * 짧은 상태 알림을 스크린리더에 보낸다.
 *
 * 같은 문자열을 연달아 넣으면 낭독되지 않는다(내용이 안 바뀌었으니까).
 * 그래서 일단 비우고 다음 틱에 채운다 — "저장됨"을 두 번 누르는 경우가 실제로 있다.
 */
function say(msg) {
  const n = document.getElementById("live");
  if (!n) return;
  n.textContent = "";
  setTimeout(() => { n.textContent = msg; }, 60);
}

function render() {
  const { name, arg } = parseHash();
  const fn = routes[name] || renderHome;
  const view = document.getElementById("view");
  view.innerHTML = "";
  document.getElementById("top").innerHTML = "";
  fn(arg);
  renderTabs(name);
  window.scrollTo(0, 0);
  /* DOM 을 통째로 바꿨으므로 포커스가 사라진 요소에 남아 있다.
     본문으로 옮겨야 다음 Tab 이 화면 처음부터 시작한다. */
  view.focus({ preventScroll: true });
  /* 제목은 topbar() 가 <h1> 으로 넣는다. 그걸 그대로 읽어준다 */
  const h1 = document.querySelector("#top h1");
  if (h1) say(h1.textContent + " 화면");
}
window.addEventListener("hashchange", render);

function topbar({ title, sub, back, right }) {
  const t = document.getElementById("top");
  // 홈을 뺀 모든 화면에는 뒤로가기가 있어야 한다. 화면마다 챙기면 빠뜨린다.
  if (back === undefined) back = parseHash().name !== "";
  if (back) {
    const b = el(`<button class="back" type="button">‹ 뒤로</button>`);
    b.onclick = () => history.length > 1 ? history.back() : go("#/");
    t.appendChild(b);
  }
  t.appendChild(el(`<div class="grow">${sub ? `<p class="sub">${esc(sub)}</p>` : ""}<h1>${esc(title)}</h1></div>`));
  if (right) t.appendChild(right);
}

/**
 * 진행률에 세는 항목 수. **프렙 화면과 홈이 같은 값을 써야 한다.**
 *
 * 묶음 머리(자식이 optional 아닌 카드)는 할 일이 아니라 이름표라 안 세고,
 * 옵션(매장에 따라 안 하는 것)도 안 센다.
 * → src/lib/types.ts 의 optionOf / optional 주석
 */
function countedTasks(list) {
  const kids = {};
  list.tasks.forEach(t => { if (t.option) (kids[t.option] = kids[t.option] || []).push(t); });
  const isHead = id => (kids[id] || []).some(k => !k.optional);
  return list.tasks.filter(t => (t.option ? !t.optional : !isHead(t.id))).length;
}

function renderTabs(active) {
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  // 하위 화면에서도 상위 탭이 켜져 있어야 지금 어디인지 알 수 있다
  /* 하위 화면에서도 상위 탭이 켜져 있어야 지금 어디인지 안다.
     발주·출퇴근은 이제 제 탭이 있으므로 운영에서 뺀다. */
  const OPS_KEYS = ["contracts","sales","cost","vendors","roster"];
  const PREP_KEYS = ["prep","recipes","recipe"];
  const cur = PREP_KEYS.includes(active) ? "prep"
    : OPS_KEYS.includes(active) ? "ops"
    : active;
  for (const t of TABS) {
    const b = el(`<button type="button" ${cur === t.key ? 'aria-current="page"' : ""}>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${t.icon}</svg>${t.label}</button>`);
    b.onclick = () => go(t.key === "" ? "#/" : `#/${t.key}`);
    wrap.appendChild(b);
  }
}

   `<details>` 를 쓴다 — 자바스크립트로 상태를 들고 있지 않아도 눌리면
   열리고, 스크린리더가 「접힘/펼침」 을 그대로 읽는다.

function fold({ title, note, count, open }) {
  const d = el(`<details class="fold"${open ? " open" : ""}>
    <summary>
      <span><b>${esc(title)}</b>${count ? `<span class="fold-n">${esc(count)}</span>` : ""}</span>
      <span class="fold-a" aria-hidden="true">▼</span>
    </summary>
    <div class="fold-body">${note ? `<p class="hint" style="margin:0 0 10px">${esc(note)}</p>` : ""}
      <div class="rows"></div>
    </div>
  </details>`);
  return { box: d, rows: d.querySelector(".rows") };
}

function renderHome() {
  topbar({ title: "오늘", sub: DATA.store.name });
  /* ★ 제목 옆 날짜·시각 (사장님 요청 2026-09-12).
     매장 태블릿은 하루 종일 켜져 있다 — 아침에 켠 화면을 저녁에 보는 일이
     실제로 있어서, 지금 몇 시인지가 화면에 없으면 어제 것을 보고 있는지
     오늘 것을 보고 있는지 알 방법이 없다. */
  {
    const h1 = document.querySelector("#top h1");
    if (h1) {
      const c = el(`<span class="clock"></span>`);
      const tick = () => {
        const d = new Date();
        c.textContent = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} `
          + `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };
      tick();
      /* 화면을 다시 그리면 이 노드도 사라지므로 타이머를 정리한다 */
      const id = setInterval(() => (c.isConnected ? tick() : clearInterval(id)), 30000);
      h1.appendChild(c);
    }
  }
  const v = document.getElementById("view");

  /* 지금 근무 중인 조 */
  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();
  const mins = s => +s.slice(0,2) * 60 + +s.slice(3);
  // 겹치는 시간대에는 방금 시작한 조를 위에 둔다.
  // 등록 순서로 두면 07:30에 제빵(05:00 시작)이 먼저 떠서,
  // 그 시각에 막 출근한 오픈조가 자기 화면을 아래에서 찾아야 한다.
  const active = DATA.shifts
    /* ★ 자정을 넘는 조(연장된 날의 마감조 14:30~01:00)는 두 구간으로 나눠 본다.
       cur >= start && cur < end 로 하면 그런 조가 절대 안 잡힌다.
       Next 앱의 src/lib/shiftClock.ts 와 같은 규칙이어야 한다. */
    .filter(s => onDuty(s, cur))
    /* ★ 2026-09-12 뒤집었다 — **일찍 시작한 조가 위**다 (사장님 지시).
       전에는 «방금 시작한 조를 위에» 였는데, 매장 사람은 «오픈 → 미들 → 마감»
       순서를 몸으로 알고 있어서 화면이 그 반대로 서면 목록을 다시 읽게 된다.
       Next 앱 `src/lib/shiftClock.ts` 의 `onDutyNow` 와 같은 규칙이어야 한다. */
    .sort((a, b) => mins(a.start) - mins(b.start));
  const clock = `${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const panel = el(`<div class="stack" style="margin-top:18px"></div>`);

    note: "첫날은 교육 모드로 한 장씩, 그 뒤엔 체크리스트로.",
    count: `${DATA.positions.length}개` });
  DATA.positions.forEach(p => {
    const n = p.sections.reduce((a,s) => a + s.steps.length, 0);
    const c = p.sections.reduce((a,s) => a + s.steps.filter(x => x.critical).length, 0);
    const card = el(`<div class="card" style="padding:14px 16px">
      <b style="font-size:15px">${esc(p.name)} <span style="font-weight:400;font-size:13px;color:var(--ink-3)">${esc(p.subtitle)}</span></b>
      <p class="meta" style="margin:2px 0 10px;font-size:12px;color:var(--ink-3)">${n}개 항목 · 꼭 지키기 ${c}개</p>
      <div class="grid2"></div></div>`);
    const g = card.querySelector(".grid2");
    const a = el(`<button type="button" class="btn-primary">교육 모드</button>`);
    a.onclick = () => go(`#/study/${p.slug}`);
    const b = el(`<button type="button">체크리스트</button>`);
    b.onclick = () => go(`#/list/${p.slug}`);
    g.append(a, b);
    f3.rows.appendChild(card);
  });
  v.appendChild(f3.box);
}

/* ------------------------------------------------------------------ *
   프렙
 * ------------------------------------------------------------------ */
function renderPrep(slug) {
  const list = DATA.prepLists.find(l => l.slug === slug) || DATA.prepLists[0];
  const prefix = `prep:${list.slug}:`;
  pruneDayKeys(prefix, bizDay());
  const key = prefix + bizDay();
  let done = new Set(store.get(key, []));
  const scales = {};

  const right = el(`<span class="count"></span>`);
  topbar({ title: list.name, sub: DATA.store.name, back: true, right });
  const v = document.getElementById("view");

  const barWrap = el(`<div class="bar" style="margin:14px 0 0"><i></i></div>`);
  v.appendChild(barWrap);

  /* ★ 추가 옵션은 부모 카드 안으로 들어간다 (2026-09-09).
     매장마다 하거나 안 하는 일(르방 등)이 목록의 한 칸을 차지하면
     9/10 이 영영 안 채워지고 진행률이 거짓이 된다. 그래서 진행률에서 뺀다.
     다만 아래 keepAll(빨간 안내)에는 그대로 센다 — 르방을 쓰는 매장에서
     "다 했습니다" 가 거짓이 되면 안 된다. 두 숫자의 분모가 다른 것은 일부러다. */
  const parentTasks = list.tasks.filter(t => !t.option);
  const optionsBy = {};
  list.tasks.forEach(t => {
    if (!t.option) return;
    (optionsBy[t.option] = optionsBy[t.option] || []).push(t);
  });

  /* ★ 「묶음 머리」 — 안에 반드시 해야 하는 항목을 담은 카드.
     주기 점검의 `기계 · 설비 점검` 처럼 그 자체가 할 일이 아니라 이름표다.
     세면 같은 일을 두 번 세게 되므로 체크도 없고 분모에도 안 들어간다.
     `바 부재료 점검 · 제조` 는 안에 든 것이 전부 optional 이라 그 카드 자체가
     할 일(점검했다)이다 → 그건 센다. */
  const isHeader = id => {
    const kids = optionsBy[id] || [];
    return kids.length > 0 && kids.some(k => !k.optional);
  };
  const counted = list.tasks.filter(t => (t.option ? !t.optional : !isHeader(t.id)));

  /* ★ 주기 목록은 다른 것을 묻는다 — "오늘 몇 개 체크했나" 가 아니라
     "지금 해야 할 게 몇 개인가". 4개월 주기를 매일 체크할 일이 없으니
     예전 방식이면 늘 0/13 이 된다. */
  const isCycle = list.tasks.some(t => t.cycle);
  let cycleDone = loadCycleDone();
  let cycleEvery = loadCycleEvery();
  const cycleItems = list.tasks.filter(t => t.cycle && t.option);
  const overdueOf = () =>
    cycleItems.filter(t => statusLine(cycleDone, t.id, cycleEvery[t.id], bizDay()).late);

  const keepAll = list.tasks.filter(t => !t.recoverable);
  const notice = (isCycle || keepAll.length)
    ? el(`<div class="notice red" style="margin-top:14px"></div>`) : null;
  if (notice) v.appendChild(notice);

  if (list.note) v.appendChild(el(`<p class="muted" style="margin:10px 2px 0">${esc(list.note)}</p>`));

  const rows = el(`<div class="rows" style="margin-top:14px"></div>`);
  v.appendChild(rows);

  function refresh() {
    const dnCount = isCycle
      ? counted.filter(t => !statusLine(cycleDone, t.id, cycleEvery[t.id], bizDay()).late).length
      : counted.filter(t => done.has(t.id)).length;
    right.textContent = `${dnCount}/${counted.length}`;
    barWrap.querySelector("i").style.width =
      `${counted.length ? Math.round(dnCount / counted.length * 100) : 0}%`;
    if (notice && isCycle) {
      const n = overdueOf().length;
      notice.className = `notice ${n ? "red" : "green"}`;
      notice.innerHTML = n
        ? `<b>지금 해야 할 것 ${n}개</b><p>기한이 지났거나 <b>언제 했는지 기록이 없는</b> 것들입니다. 기록이 없으면 3년 전에 했는지 어제 했는지 알 수 없습니다.</p>`
        : `<b>기한 지난 것이 없습니다</b>`;
    } else if (notice) {
      const left = keepAll.filter(t => !done.has(t.id)).length;
      notice.className = `notice ${left ? "red" : "green"}`;
      notice.innerHTML = left
        ? `<b>까먹지 말고 해야 할 것 ${left}개</b><p>빨간 테두리로 표시된 것들입니다. 오늘 안 하면 내일 아침에 되돌릴 방법이 없습니다.</p>`
        : `<b>오늘 꼭 해야 할 건 다 했습니다</b>`;
    }
  }

  parentTasks.forEach(t => {
    const head = isHeader(t.id);
    const card = el(`<div class="task ${t.recoverable ? "" : "keep"}"></div>`);
    /* 묶음 머리는 누를 수 없다. 아무 일도 안 하는 버튼을 두면
       스크린리더도 "버튼" 이라고 읽는다 */
    const hit = head
      ? el(`<div class="task-hit"></div>`)
      : el(`<button type="button" class="task-hit"></button>`);
    const tick = el(`<span class="tick" aria-hidden="true">${CHECK}</span>`);
    const body = el(`<div style="min-width:0;flex:1"></div>`);

    const tags = [];
    // 묶음 머리의 주기는 자식마다 달라서 하나로 못 적는다
    if (!head) tags.push(`<span class="pill mono">${esc(t.trigger)}</span>`);
    if (t.critical) tags.unshift(`<span class="pill crit">꼭 지키기</span>`);
    if (t.varies) tags.push(`<span class="pill warn">수량 매일 다름</span>`);
    if (tags.length) body.appendChild(el(`<div class="tags">${tags.join("")}</div>`));
    body.appendChild(el(`<h3>${esc(t.title)}</h3>`));
    body.appendChild(el(`<p class="desc">${esc(t.desc)}</p>`));

    if (t.hours != null) {
      body.appendChild(el(`<p class="slot">지금 걸면 → <b>${readyAt(t.hours)}</b>부터 사용 가능 <span class="dim">(${t.hours}시간)</span></p>`));
    }
    if (t.days != null) {
      const a = arrivesIn(t.days);
      body.appendChild(el(`<p class="slot">오늘 주문 → <b>${a.label}</b> 도착${a.overWeekend ? ` <span class="dim">(주말 배송 없음)</span>` : ""}</p>`));
    }
    /* ★ "안 하면 —" 은 리드타임이 없는 항목에만 띄운다.
       "지금 걸면 → 내일 07:43 부터" 가 이미 같은 말을 하고,
       "쿠팡으로 메울 수 있습니다" 같은 문장은 안 해도 괜찮다고 알려주는
       셈이라 해롭다 (사장님 지적 2026-09-08).
       묶음 머리는 할 일이 아니라 이름표라서 역시 안 띄운다. */
    const tHasLead = t.hours != null || t.days != null;
    if (!head && !tHasLead && (t.conseq || "").trim() !== "") {
      body.appendChild(el(`<p class="conseq">안 하면 — ${esc(t.conseq)}</p>`));
    }

    if (head) {
      hit.append(body);
    } else {
      hit.append(tick, body);
      hit.onclick = () => {
        done.has(t.id) ? done.delete(t.id) : done.add(t.id);
        store.set(key, [...done]);
        card.classList.toggle("done", done.has(t.id));
        hit.setAttribute("aria-pressed", String(done.has(t.id)));
        refresh();
      };
      hit.setAttribute("aria-pressed", String(done.has(t.id)));
      if (done.has(t.id)) card.classList.add("done");
    }
    card.appendChild(hit);

    /* ★ 배수 계산기를 부품으로 뽑았다 (2026-09-09).
       옵션 안에서도 레시피를 바로 보고 만들 수 있어야 해서, 부모 카드와
       옵션이 같은 것을 쓴다. 두 벌 두면 한쪽만 고치게 된다. */
    const scalerFor = (taskId, rec, compact) => {
      scales[taskId] = scales[taskId] || 1;
      const sc = el(`<div class="scaler${compact ? " scaler-sm" : ""}">
        <span class="eyebrow">오늘 몇 배?</span>
        <div class="scale-grid"></div>
        <p class="yield"></p>
        <ul class="ing"></ul></div>`);
      const grid = sc.querySelector(".scale-grid");
      const draw = () => {
        const s = scales[taskId];
        [...grid.children].forEach((b, i) => b.setAttribute("aria-pressed", String(SCALES[i] === s)));
        // 단위(unit)도 사용자가 직접 치는 값이다. 지금은 recipeBy()가 내장
        // 레시피만 보지만, 사용자 레시피를 합치는 순간 그대로 취약해진다.
        sc.querySelector(".yield").innerHTML =
          `${esc(rec.name)} · 1배합 ${rec.yield.amount}${esc(rec.yield.unit)} → <b>${fmt(rec.yield.amount, s)}${esc(rec.yield.unit)}</b>`;
        sc.querySelector(".ing").innerHTML = rec.ingredients.map(i =>
          `<li><span class="nm">${esc(i.name)}${i.note ? `<span class="nt">${esc(i.note)}</span>` : ""}</span>
           <span class="amt ${s !== 1 ? "on" : ""}">${fmt(i.amount, s)}${esc(i.unit)}</span></li>`).join("");
      };
      SCALES.forEach(s => {
        const b = el(`<button type="button">${s}배</button>`);
        b.onclick = () => { scales[taskId] = s; draw(); };
        grid.appendChild(b);
      });
      draw();

      /* ★ 만드는 순서를 여기 붙인다 (사장님 요청 2026-09-10:
         "프렙이랑 레시피랑 같이 있어야 하는데").
         전에는 재료와 배수만 있고 순서를 보려면 레시피 화면으로 나가야 했다.
         재료와 순서는 한 몸이다. 접어 두는 것은 목록을 훑을 수 있게 하기
         위해서다 — 한 번 누르는 것과 화면을 옮기는 것은 다르다. */
      if ((rec.steps || []).length) {
        const det = el(`<details class="steps">
          <summary><span class="caret">›</span> 만드는 순서 ${rec.steps.length}단계${rec.note ? ` <span class="dim">${esc(rec.note)}</span>` : ""}</summary>
          <ol class="steplist"></ol>
        </details>`);
        const ol = det.querySelector(".steplist");
        rec.steps.forEach((st, i) => {
          const li = el(`<li class="step${st.critical ? " crit" : ""}">
            <span class="stepno">${i + 1}</span>
            <div style="min-width:0;flex:1">
              ${st.critical ? `<span class="pill crit">꼭 지키기</span>` : ""}
              <h4>${esc(st.title)}</h4>
              <p>${esc(st.desc)}</p>
              ${st.tip ? `<p class="tip"><b>선배 한마디</b> ${esc(st.tip)}</p>` : ""}
            </div>
          </li>`);
          ol.appendChild(li);
        });
        sc.appendChild(det);
      }
      return sc;
    };

    const rec = t.recipe && recipeBy(t.recipe);
    if (rec) card.appendChild(scalerFor(t.id, rec, false));
    /* ---------- 추가 옵션 ---------- */
    const opts = optionsBy[t.id] || [];
    if (opts.length) {
      /* ★ 같은 자리에 두 가지가 온다. 필수 묶음(주기 점검)에
         "안 하기도 합니다" 를 쓰면 거짓이다 — 보건증·소방은 매장 사정과 무관하다 */
      const optWrap = head
        ? el(`<div class="opts"><span class="eyebrow">이 묶음의 항목 ${opts.length}개</span></div>`)
        : el(`<div class="opts">
        <span class="eyebrow">추가 옵션</span>
        <p class="opts-note">매장에 따라 안 하기도 합니다. <b>하는 매장만</b> 체크하세요 — 위의 진행률에는 안 들어갑니다.</p>
        </div>`);
      (isCycle ? byUrgency(opts, cycleDone, cycleEvery, bizDay()) : opts).forEach(o => {
        const oSt = o.cycle ? statusLine(cycleDone, o.id, cycleEvery[o.id], bizDay()) : null;
        const oc = el(`<div class="task opt ${oSt ? (oSt.late ? "keep" : "") : (o.recoverable ? "" : "keep")}"></div>`);
        const oh = el(`<button type="button" class="task-hit"></button>`);
        const ot = el(`<span class="tick" aria-hidden="true">${CHECK}</span>`);
        const ob = el(`<div style="min-width:0;flex:1"></div>`);
        /* ★ 주기 항목은 발동 뱃지를 안 그린다. "1개월마다" 는 매장마다 다르고,
           모르는 숫자를 띄우면 사장님이 그걸 믿는다. 아래 입력칸에서 정한다 */
        const otags = o.cycle ? [] : [`<span class="pill mono">${esc(o.trigger)}</span>`];
        if (o.critical) otags.unshift(`<span class="pill crit">꼭 지키기</span>`);
        ob.appendChild(el(`<div class="tags">${otags.join("")}</div>`));
        ob.appendChild(el(`<h3>${esc(o.title)}</h3>`));
        ob.appendChild(el(`<p class="desc">${esc(o.desc)}</p>`));
        if (o.hours != null) {
          ob.appendChild(el(`<p class="slot">지금 걸면 → <b>${readyAt(o.hours)}</b>부터 사용 가능</p>`));
        }
        /* ★ 마지막으로 한 날. 이게 없어서 이 화면이 아무 기능을 못 했다 */
        let oSlot = null;
        const paintSlot = () => {
          if (!oSlot) return;
          const st = statusLine(cycleDone, o.id, cycleEvery[o.id], bizDay());
          oSlot.textContent = st.text;
          oSlot.className = `slot${st.late ? " late" : ""}`;
          oc.classList.toggle("keep", st.late);
        };
        if (o.cycle) {
          oSlot = el(`<p class="slot"></p>`);
          ob.appendChild(oSlot);
          paintSlot();
        }
        // 부모 카드와 같은 규칙
        if (o.hours == null && o.days == null && (o.conseq || "").trim() !== "") {
          ob.appendChild(el(`<p class="conseq">안 하면 — ${esc(o.conseq)}</p>`));
        }
        oh.append(ot, ob);
        const orec = o.recipe && recipeBy(o.recipe);
        const isOn = () => o.cycle
          ? cycleDone[o.id] === bizDay()
          : done.has(o.id);
        oh.onclick = () => {
          if (o.cycle) {
            // 주기 항목은 "오늘 했다" 를 남긴다. 오늘 것을 다시 누르면 취소
            const next = { ...cycleDone };
            if (next[o.id] === bizDay()) delete next[o.id];
            else next[o.id] = bizDay();
            cycleDone = next;
            saveCycleDone(next);
          } else {
            done.has(o.id) ? done.delete(o.id) : done.add(o.id);
            store.set(key, [...done]);
          }
          oc.classList.toggle("done", isOn());
          oh.setAttribute("aria-pressed", String(isOn()));
          // 줄도 같이 고쳐야 한다. 안 그러면 눌러도 "기록 없음" 이 그대로 남는다
          paintSlot();
          refresh();
        };
        oh.setAttribute("aria-pressed", String(isOn()));
        if (isOn()) oc.classList.add("done");
        oc.appendChild(oh);
        /* ★ 주기와 마지막 날짜는 매장이 넣는다.
           날짜 칸이 있어야 지난 기록도 채워 넣을 수 있다 */
        if (o.cycle) {
          const box = el(`<div class="cyc">
            <label>마지막 <input type="date" max="${bizDay()}" value="${esc(cycleDone[o.id] || "")}"></label>
            <label>주기 <input type="number" min="1" placeholder="미정" value="${cycleEvery[o.id] != null ? cycleEvery[o.id] : ""}"> 일</label>
          </div>`);
          const dIn = box.querySelectorAll("input")[0];
          const eIn = box.querySelectorAll("input")[1];
          dIn.onchange = () => {
            const next = { ...cycleDone };
            // 미래 날짜는 기한 계산을 뒤집어 빨간 표시를 오히려 푼다
            if (DAY_RE.test(dIn.value) && dIn.value <= bizDay()) next[o.id] = dIn.value;
            else delete next[o.id];
            cycleDone = next; saveCycleDone(next); paintSlot(); refresh();
          };
          eIn.onchange = () => {
            const next = { ...cycleEvery };
            const v = Number(eIn.value);
            if (eIn.value.trim() !== "" && isFinite(v) && v > 0) next[o.id] = Math.round(v);
            else delete next[o.id];
            cycleEvery = next; saveCycleEvery(next); paintSlot(); refresh();
          };
          oc.appendChild(box);
        }
        if (orec) oc.appendChild(scalerFor(o.id, orec, true));
        optWrap.appendChild(oc);
      });
      card.appendChild(optWrap);
    }

    rows.appendChild(card);
  });

  refresh();
}

/* ------------------------------------------------------------------ *
   레시피
 * ------------------------------------------------------------------ */
function myRecipes() { return store.get("recipes:mine", []); }

/* ★ 프렙 — 목록과 레시피 찾기를 한 화면에 (2026-09-10)
   위는 **오늘 할 것**(프렙 목록), 아래는 **주문 받고 찾는 것**(레시피).
   둘을 탭으로 나눠 두면 무엇이 다른지 알 수 없다.
   ⚠️ 이름은 `프렙` 그대로다 — 매장에서 쓰는 말이라 내가 지어낼 것이 아니다. */
function renderPrepIndex() {
  topbar({ title: "프렙", sub: DATA.store.name });
  const v = document.getElementById("view");

  const sec = el(`<section class="sec"><h2>오늘 할 것</h2>
    <p class="muted" style="margin:2px 0 10px">오늘 해야 내일 쓸 수 있는 것들입니다.</p>
    <div class="rows"></div></section>`);
  DATA.prepLists.forEach(l => {
    const n = countedTasks(l);
    const keep = l.tasks.filter(t => !t.recoverable).length;
    const b = el(`<button type="button" class="nav-row"><span><b>${esc(l.name)}</b>
      <span class="meta">${n}개${keep ? ` · <b style="color:var(--danger)">까먹지 말 것 ${keep}개</b>` : ""}</span></span>
      <span class="chev">›</span></button>`);
    b.onclick = () => go(`#/prep/${l.slug}`);
    sec.querySelector(".rows").appendChild(b);
  });
  v.appendChild(sec);

  v.appendChild(el(`<h2 class="sec-h">주문 받고 찾을 때</h2>`));
  renderRecipes(true);
}

function renderRecipes(embed) {
  if (!embed) topbar({ title: "레시피", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  const all = () => [...DATA.recipes, ...myRecipes()];

  const q = el(`<input type="search" placeholder="메뉴 이름 (예: 라떼)" aria-label="레시피 검색" style="margin-top:16px">`);
  const add = el(`<button type="button" class="btn-primary" style="width:100%;margin-top:8px;padding:13px">+ 레시피 추가</button>`);
  add.onclick = openForm;
  const cats = el(`<div class="row-in" style="margin-top:12px"></div>`);
  const rows = el(`<div class="rows" style="margin-top:14px"></div>`);
  v.append(q, add, cats, rows);

  function draw() {
    const k = q.value.trim().toLowerCase();
    const hit = all().filter(r => !k || r.name.toLowerCase().includes(k) || r.category.toLowerCase().includes(k));

    cats.innerHTML = "";
    [["전체", ""], ...[...new Set(all().map(r => r.category))].map(c => [c, c])].forEach(([lab, val]) => {
      const b = el(`<button type="button" style="padding:6px 12px;font-size:13px;font-weight:600;${q.value === val ? "background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-fill-t)" : ""}">${esc(lab)}</button>`);
      b.onclick = () => { q.value = val; draw(); };
      cats.appendChild(b);
    });

    rows.innerHTML = "";
    if (!hit.length) {
      rows.appendChild(el(`<p class="muted" style="text-align:center;padding:24px 0">“${esc(q.value)}” 에 해당하는 레시피가 없습니다.</p>`));
      return;
    }
    hit.forEach(r => {
      const mine = !!r.mine;
      const b = el(`<button type="button" class="nav-row"><span>
        <b>${esc(r.name)}</b>
        ${r.forNewbie ? ' <span class="pill new">첫 주</span>' : ""}
        ${mine ? ' <span class="pill">직접 추가</span>' : ""}
        <span class="meta">${esc(r.category)} · 1배합 ${r.yield.amount}${esc(r.yield.unit)} · 재료 ${r.ingredients.length}개</span>
        </span><span class="chev">›</span></button>`);
      b.onclick = () => go(`#/recipe/${r.slug}`);
      rows.appendChild(b);
    });
  }
  q.oninput = draw;
  draw();

  function openForm() {
    const box = el(`<div class="card" style="padding:16px;margin-top:16px">
      <b style="font-size:15px">레시피 추가</b>
      <p class="muted" style="margin:2px 0 12px">이름과 재료 한 줄이면 저장됩니다.</p>
      <div class="stack">
        <div class="field"><label for="rn">메뉴 이름</label><input id="rn" placeholder="예: 바닐라라떼"></div>
        <div class="row-in">
          <div class="field" style="flex:1"><label for="rc">분류</label><input id="rc" value="음료"></div>
          <div class="field" style="width:96px"><label for="ry">1배합</label><input id="ry" type="number" value="1"></div>
          <div class="field" style="width:88px"><label for="ru">단위</label><input id="ru" value="잔"></div>
        </div>
        <div class="field"><label>재료</label><div class="stack" id="ings"></div></div>
        <button type="button" id="more" style="border-style:dashed">+ 재료 추가</button>
        <button type="button" class="btn-primary" id="save" style="padding:13px">저장</button>
      </div></div>`);
    const ings = box.querySelector("#ings");
    const addRow = () => ings.appendChild(el(`<div class="row-in">
      <input placeholder="재료" aria-label="재료 이름" style="flex:2;min-width:110px" class="i-n">
      <input placeholder="양" aria-label="재료 양" type="number" style="flex:1;min-width:70px" class="i-a">
      <input placeholder="단위" aria-label="재료 단위" value="g" style="width:76px" class="i-u"></div>`));
    addRow(); addRow();
    box.querySelector("#more").onclick = addRow;
    box.querySelector("#save").onclick = () => {
      const name = box.querySelector("#rn").value.trim();
      const list = [...ings.children].map(r => ({
        name: r.querySelector(".i-n").value.trim(),
        amount: +r.querySelector(".i-a").value || 0,
        unit: r.querySelector(".i-u").value.trim() || "g", note: null
      })).filter(i => i.name && i.amount);
      if (!name || !list.length) { alert("메뉴 이름과 재료 한 줄은 있어야 저장됩니다."); return; }
      const slug = "my-" + Math.random().toString(36).slice(2, 9);
      const mine = myRecipes();
      mine.push({ slug, name, mine: true, forNewbie: false,
        category: box.querySelector("#rc").value.trim() || "기타",
        yield: { amount: +box.querySelector("#ry").value || 1, unit: box.querySelector("#ru").value.trim() || "개" },
        ingredients: list, steps: [], note: null });
      store.set("recipes:mine", mine);
      go(`#/recipe/${slug}`);
    };
    add.replaceWith(box);
  }
}

function renderRecipe(slug) {
  const r = [...DATA.recipes, ...myRecipes()].find(x => x.slug === slug);
  if (!r) { topbar({ title: "레시피", back: true }); document.getElementById("view").appendChild(el(`<p class="muted" style="padding:32px 0;text-align:center">레시피를 찾을 수 없습니다.</p>`)); return; }

  topbar({ title: r.name, sub: `${DATA.store.name} · ${r.category}`, back: true });
  const v = document.getElementById("view");
  let s = 1;

  const box = el(`<div class="card" style="padding:16px;margin-top:16px;background:var(--accent-w);border-color:var(--accent-b)">
    <span class="eyebrow" style="color:var(--accent)">몇 배로 만드나요?</span>
    <div class="scale-grid" style="margin-top:8px"></div>
    <p style="margin:12px 0 0;font-weight:700;font-size:15px" id="y"></p></div>`);
  const grid = box.querySelector(".scale-grid");
  const ing = el(`<section class="sec"><h2>재료</h2><div class="card" style="padding:6px 16px"><ul class="ing"></ul></div>
    <p class="muted" id="pc" style="margin-top:8px"></p></section>`);

  const draw = () => {
    [...grid.children].forEach((b, i) => b.setAttribute("aria-pressed", String(SCALES[i] === s)));
    // unit 은 '레시피 추가' 폼(#ru, .i-u)에서 그대로 들어온 문자열이다.
    // 이름은 esc 를 거치는데 단위만 빠져 있어서, 단위 칸에 태그를 넣으면
    // 목록 화면만 열어도 실행됐다. el() 의 <template> 은 방어가 아니다.
    box.querySelector("#y").innerHTML = `${r.yield.amount}${esc(r.yield.unit)} → <span style="font-family:var(--mono);color:var(--accent)">${fmt(r.yield.amount, s)}${esc(r.yield.unit)}</span> 나옵니다`;
    ing.querySelector(".ing").innerHTML = r.ingredients.map(i =>
      `<li><span class="nm">${esc(i.name)}${i.note ? `<span class="nt">${esc(i.note)}</span>` : ""}</span>
       <span class="amt ${s !== 1 ? "on" : ""}">${fmt(i.amount, s)}${esc(i.unit)}</span></li>`).join("");
    ing.querySelector("#pc").textContent = s === 1 ? (r.note || "") : `${s}배로 계산된 값입니다. 퍼센트는 배수와 상관없이 그대로입니다.`;
  };
  SCALES.forEach(x => { const b = el(`<button type="button">${x}배</button>`); b.onclick = () => { s = x; draw(); }; grid.appendChild(b); });
  v.append(box, ing);
  draw();

  if (r.steps && r.steps.length) {
    const sec = el(`<section class="sec"><h2>만드는 순서</h2><div class="rows"></div></section>`);
    r.steps.forEach((st, i) => sec.querySelector(".rows").appendChild(el(`<div class="card" style="padding:14px 16px">
      ${st.critical ? '<span class="pill crit">꼭 지키기</span>' : ""}
      <b style="display:block;margin-top:${st.critical ? "6px" : "0"}"><span style="font-family:var(--mono);color:var(--ink-3)">${i+1}</span> &nbsp;${esc(st.title)}</b>
      <p class="desc" style="margin:4px 0 0">${esc(st.desc)}</p>
      <div class="grid2" style="margin-top:10px"><div class="ph">좋은 예<br>촬영 후 여기</div><div class="ph">나쁜 예<br>촬영 후 여기</div></div>
      </div>`)));
    v.appendChild(sec);
  }
}

/* ------------------------------------------------------------------ *
   근무표
 * ------------------------------------------------------------------ */
function renderRoster() {
  topbar({ title: "근무표", sub: DATA.store.name, back: true });
  const v = document.getElementById("view");
  let data = store.get("roster", { staff: [], assign: {} });
  let mode = store.get("roster:mode", "month");   // 달력이 기본. 한 달을 보는 게 근무표의 목적이다
  let cursor = new Date();                        // 주 보기는 이 날이 속한 주, 달 보기는 이 달
  const save = () => store.set("roster", data);
  const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const shiftOf = (id, d) => (data.assign[id] || {})[dk(d)] || "";

  /* 섹션마다 색을 준다. 달력에서 누가 나오는지 색으로 먼저 읽히게. */
  /* 토큰을 가리키기만 한다. hex 를 여기 박으면 다크모드에서 안 뒤집힌다 */
  const SEC_COLORS = ["var(--sec-1)", "var(--sec-2)", "var(--sec-3)",
                      "var(--sec-4)", "var(--sec-5)", "var(--sec-6)"];
  const sections = () => [...new Set(data.staff.map(s => s.section.trim() || "미지정"))];
  const colorOf = sec => SEC_COLORS[sections().indexOf(sec) % SEC_COLORS.length];
  const secOf = s => s.section.trim() || "미지정";

  /* ---------- 상단: 보기 전환 + 이동 ---------- */
  const bar = el(`<div class="card" style="padding:9px 12px;margin-top:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <div style="display:flex;gap:4px">
      <button type="button" id="mw" style="padding:7px 14px;font-size:13px;font-weight:700">주</button>
      <button type="button" id="mm" style="padding:7px 14px;font-size:13px;font-weight:700">월</button>
    </div>
    <div style="flex:1"></div>
    <button type="button" id="prev" style="padding:7px 11px">‹</button>
    <b id="lbl" style="font-family:var(--mono);font-size:13px;min-width:132px;text-align:center"></b>
    <button type="button" id="next" style="padding:7px 11px">›</button>
    <button type="button" id="tod" style="padding:7px 11px;font-size:12px">오늘</button>
  </div>`);
  bar.querySelector("#mw").onclick = () => { mode = "week"; store.set("roster:mode", mode); paint(); };
  bar.querySelector("#mm").onclick = () => { mode = "month"; store.set("roster:mode", mode); paint(); };
  bar.querySelector("#prev").onclick = () => { move(-1); };
  bar.querySelector("#next").onclick = () => { move(1); };
  bar.querySelector("#tod").onclick = () => { cursor = new Date(); paint(); };
  function move(dir) {
    if (mode === "week") cursor.setDate(cursor.getDate() + dir * 7);
    else cursor.setMonth(cursor.getMonth() + dir, 1);
    paint();
  }

  /* ---------- 직원 추가 ---------- */
  const form = el(`<section class="sec"><h2>직원</h2>
    <div class="card" style="padding:14px 16px"><div class="row-in">
      <input class="f-sec" placeholder="섹션 (예: 제빵)" aria-label="섹션" style="width:130px">
      <input class="f-name" placeholder="이름" aria-label="직원 이름" style="width:110px">
      <input class="f-mail" type="email" placeholder="이메일" aria-label="이메일" style="flex:1;min-width:170px">
      <input class="f-tel" type="tel" placeholder="전화번호" aria-label="전화번호" style="width:150px">
      <button type="button" class="btn-primary f-add">추가</button>
    </div></div></section>`);
  form.querySelector(".f-add").onclick = () => {
    const name = form.querySelector(".f-name").value.trim();
    if (!name) return;
    data.staff.push({
      id: "s" + Date.now().toString(36), name,
      section: form.querySelector(".f-sec").value.trim(),
      email: form.querySelector(".f-mail").value.trim(),
      phone: form.querySelector(".f-tel").value.trim()
    });
    form.querySelector(".f-name").value = "";
    form.querySelector(".f-mail").value = "";
    form.querySelector(".f-tel").value = "";
    save(); paint();
  };

  const calSec = el(`<section class="sec"></section>`);
  const listSec = el(`<section class="sec"></section>`);
  const sendSec = el(`<section class="sec"></section>`);
  v.append(bar, calSec, form, listSec, sendSec);

  /* ---------- 하루 배정 편집 ---------- */
  function editDay(d) {
    const wrap = el(`<div class="card" style="padding:16px;margin-top:12px">
      <div style="display:flex;align-items:center;gap:10px">
        <b style="font-size:15px">${dayLabel(d)} 근무 배정</b>
        <div style="flex:1"></div>
        <button type="button" id="close" style="padding:6px 12px;font-size:12px">닫기</button>
      </div>
      <div class="stack" style="margin-top:12px"></div></div>`);
    const box = wrap.querySelector(".stack");
    data.staff.forEach(s => {
      const cur = shiftOf(s.id, d);
      const row = el(`<div style="display:flex;align-items:center;gap:10px">
        <span style="width:9px;height:9px;border-radius:50%;background:${colorOf(secOf(s))};flex:none"></span>
        <span style="flex:1;min-width:0"><b style="font-size:14px">${esc(s.name)}</b>
          <span class="muted" style="margin-left:6px">${esc(s.section || "—")}</span></span>
        <select style="width:150px;padding:8px;font-size:13px;font-weight:600">
          <option value="">휴무</option>
          ${DATA.shifts.map(sh => `<option ${cur === sh.name ? "selected" : ""}>${sh.name}</option>`).join("")}
        </select></div>`);
      row.querySelector("select").onchange = e => {
        (data.assign[s.id] ||= {})[dk(d)] = e.target.value;
        save(); paint(dk(d));
      };
      box.appendChild(row);
    });
    wrap.querySelector("#close").onclick = () => paint();
    return wrap;
  }

  /* ---------- 달력 ---------- */
  function monthGrid(openKey) {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const first = new Date(y, m, 1);
    const start = mondayOf(first);
    const cells = [];
    const d = new Date(start);
    // 6주면 어떤 달이든 덮인다
    for (let i = 0; i < 42; i++) { cells.push(new Date(d)); d.setDate(d.getDate() + 1); }
    // 마지막 주가 통째로 다음 달이면 뺀다
    while (cells.length > 35 && cells[35].getMonth() !== m && cells[34].getMonth() !== m) cells.length = 35;

    const todayK = dk(new Date());
    const wrap = el(`<div class="card" style="overflow:hidden">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)">
        ${[1, 2, 3, 4, 5, 6, 0].map(dow => `<div style="padding:8px 0;text-align:center;font-size:12px;font-weight:600;color:${dow === 0 ? "var(--danger)" : dow === 6 ? "var(--sat)" : "var(--ink-3)"}">${WD[dow]}</div>`).join("")}
      </div>
      <div id="cells" style="display:grid;grid-template-columns:repeat(7,1fr)"></div></div>`);
    const grid = wrap.querySelector("#cells");

    cells.forEach((day, i) => {
      const key = dk(day);
      const other = day.getMonth() !== m;
      const on = data.staff.filter(s => shiftOf(s.id, day));
      const cell = el(`<button type="button" style="
        min-height:82px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
        border-radius:0;background:${key === todayK ? "var(--accent-w)" : "var(--surface)"};
        padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:stretch;
        ${other ? "opacity:.38" : ""}${(i % 7 === 6) ? ";border-right:0" : ""}">
        <span style="font-family:var(--mono);font-size:12px;font-weight:${key === todayK ? 700 : 500};
          color:${day.getDay() === 0 ? "var(--danger)" : day.getDay() === 6 ? "var(--sat)" : "var(--ink-2)"}">${day.getDate()}</span>
      </button>`);

      on.slice(0, 3).forEach(s => cell.appendChild(el(`<span style="
        display:block;font-size:11px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;border-radius:4px;padding:1px 4px;
        background:color-mix(in srgb, ${colorOf(secOf(s))} 8%, transparent);color:${colorOf(secOf(s))}">${esc(s.name)}</span>`)));
      if (on.length > 3) cell.appendChild(el(`<span class="muted" style="font-size:10px">+${on.length - 3}</span>`));

      cell.onclick = () => paint(key);
      grid.appendChild(cell);
    });
    return wrap;
  }

  /* ---------- 주 표 ---------- */
  function weekTable() {
    const D = weekDays(mondayOf(cursor));
    const tb = el(`<div class="tbl-wrap"><table>
      <thead><tr><th class="sticky-col" scope="col">직원</th>${D.map(d => `<th class="num" scope="col" style="min-width:104px;${d.getDay() === 0 ? "color:var(--danger)" : d.getDay() === 6 ? "color:var(--sat)" : ""}">${dayLabel(d)}</th>`).join("")}</tr></thead>
      <tbody></tbody></table></div>`);
    const tbody = tb.querySelector("tbody");
    data.staff.forEach(s => {
      const tr = el(`<tr><th class="sticky-col" scope="row">
        <b>${esc(s.name)}</b><br><span class="muted" style="font-size:11px">${esc(s.section || "—")}</span></th></tr>`);
      D.forEach(d => {
        const cur = shiftOf(s.id, d);
        const td = el(`<td><select aria-label="${esc(s.name)} ${dayLabel(d)} 근무" style="padding:7px;font-size:12px;font-weight:600;${cur ? `background:${colorOf(secOf(s))}14;border-color:${colorOf(secOf(s))}55;color:${colorOf(secOf(s))}` : "color:var(--ink-3)"}">
          <option value="">휴무</option>${DATA.shifts.map(sh => `<option ${cur === sh.name ? "selected" : ""}>${sh.name}</option>`).join("")}</select></td>`);
        td.querySelector("select").onchange = e => {
          (data.assign[s.id] ||= {})[dk(d)] = e.target.value; save(); paint();
        };
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    return tb;
  }

  /* ---------- 메일 본문 ---------- */
  /**
   * 연락처를 본문에 넣을지. 기본은 안 넣는다.
   *
   * 받는 사람을 숨은참조(bcc)로 가려놓고 본문에 이메일·전화번호를 그대로
   * 실으면 가린 의미가 없다 — 직원 A가 받은 메일에 직원 B의 전화번호가
   * 다 보인다. 연락처 공유가 필요할 때만 사용자가 켠다.
   */
  let withContacts = false;

  function body(D) {
    const out = [`${DATA.store.name} 근무표`, `${dayLabel(D[0])} ~ ${dayLabel(D[D.length - 1])}`, "", "[ 직원 명단 ]"];
    const p = (t, w) => { let n = 0; for (const c of t) n += c.charCodeAt(0) > 0x2000 ? 2 : 1; return t + " ".repeat(Math.max(1, w - n)); };
    if (withContacts) {
      out.push("섹션      이름        이메일                    전화번호", "-".repeat(64));
      data.staff.forEach(s => out.push(p(s.section || "-", 10) + p(s.name, 12) + p(s.email || "-", 26) + (s.phone || "-")));
    } else {
      out.push(p("섹션", 10) + "이름", "-".repeat(28));
      data.staff.forEach(s => out.push(p(s.section || "-", 10) + s.name));
    }
    out.push("", "[ 근무 ]", "");
    const groups = {};
    data.staff.forEach(s => (groups[secOf(s)] ||= []).push(s));
    for (const [sec, mem] of Object.entries(groups)) {
      out.push(`● ${sec}`);
      mem.forEach(s => {
        out.push(`  - ${s.name}`);
        out.push("    " + D.map(d => `${dayLabel(d)} ${shiftOf(s.id, d) || "휴무"}`).join("  /  "));
      });
      out.push("");
    }
    out.push("변경 사항이 있으면 알려주세요.");
    return out.join("\n");
  }

  /* ---------- 그리기 ---------- */
  function paint(openKey) {
    const week = mode === "week";
    bar.querySelector("#mw").className = week ? "btn-primary" : "";
    bar.querySelector("#mm").className = week ? "" : "btn-primary";
    bar.querySelector("#lbl").textContent = week
      ? `${dayLabel(weekDays(mondayOf(cursor))[0])} ~ ${dayLabel(weekDays(mondayOf(cursor))[6])}`
      : `${cursor.getFullYear()}년 ${cursor.getMonth() + 1}월`;

    calSec.innerHTML = ""; listSec.innerHTML = ""; sendSec.innerHTML = "";

    if (!data.staff.length) {
      calSec.appendChild(el(`<p class="muted" style="text-align:center;padding:26px 0">직원을 추가하면 근무표가 만들어집니다.</p>`));
      return;
    }

    calSec.appendChild(week ? weekTable() : monthGrid(openKey));

    if (!week && openKey) {
      const [yy, mm, dd] = openKey.split("-").map(Number);
      calSec.appendChild(editDay(new Date(yy, mm - 1, dd)));
    }

    if (!week) {
      const legend = el(`<div class="row-in" style="margin-top:10px"></div>`);
      sections().forEach(sec => legend.appendChild(el(`<span class="pill" style="background:${colorOf(sec)}1a;color:${colorOf(sec)}">${esc(sec)}</span>`)));
      legend.appendChild(el(`<span class="muted" style="align-self:center">날짜를 누르면 그날 배정을 고칩니다</span>`));
      calSec.appendChild(legend);
    }

    /* 명단 */
    listSec.appendChild(el(`<h2>직원 명단</h2>`));
    listSec.appendChild(el(`<p class="hint">메일에 이 표가 그대로 들어갑니다.</p>`));
    listSec.appendChild(el(`<div class="tbl-wrap"><table>
      <thead><tr><th scope="col">섹션</th><th scope="col">이름</th><th scope="col">이메일</th><th class="num" scope="col">전화번호</th><th scope="col"><span class="sr-only">지우기</span></th></tr></thead>
      <tbody>${data.staff.map(s => `<tr>

/* ------------------------------------------------------------------ *
   교육 모드
 * ------------------------------------------------------------------ */
function renderStudy(slug) {
  const v = document.getElementById("view");
  if (!slug) {
    topbar({ title: "교육 모드", sub: DATA.store.name, back: true });
    const rows = el(`<div class="rows" style="margin-top:16px"></div>`);
    DATA.positions.forEach(p => {
      const b = el(`<button type="button" class="nav-row"><span><b>${esc(p.name)}</b><span class="meta">${esc(p.subtitle)}</span></span><span class="chev">›</span></button>`);
      b.onclick = () => go(`#/study/${p.slug}`);
      rows.appendChild(b);
    });
    v.appendChild(rows);
    return;
  }

  const pos = DATA.positions.find(p => p.slug === slug) || DATA.positions[0];
  const flat = pos.sections.flatMap(s => s.steps.map(t => ({ ...t, sec: s.title })));
  let idx = -1, ok = false;

  function paint() {
    v.innerHTML = ""; document.getElementById("top").innerHTML = "";

    if (idx < 0) {
      topbar({ title: pos.name, sub: DATA.store.name, back: true });
      const est = Math.max(3, Math.round(flat.length * 0.7));
      const c = el(`<div class="center">
        <p class="eyebrow">${esc(pos.subtitle)}</p>
        <h2>${esc(pos.name)}</h2>
        <p style="max-width:34em;color:var(--ink-2);margin:6px 0 0">${esc(pos.summary)}</p>
        <p class="muted" style="font-family:var(--mono)">${flat.length}개 항목 · 약 ${est}분</p>
        <button type="button" class="btn-primary" style="margin-top:18px;padding:16px 52px;font-size:19px">시작하기</button>
        <p class="muted" style="margin-top:10px">다 보고 나면 처음으로 돌아갑니다. 다음 사람은 여기서 다시 시작하면 됩니다.</p></div>`);
      c.querySelector("button").onclick = () => { idx = 0; ok = false; paint(); };
      v.appendChild(c);
      return;
    }
    if (idx >= flat.length) {
      topbar({ title: "완료", sub: pos.name, back: true });
      const c = el(`<div class="center"><h2>수고하셨습니다</h2>
        <p style="color:var(--ink-2)">${esc(pos.name)} 교육을 모두 마쳤습니다.</p>
        <button type="button" style="margin-top:20px;padding:14px 40px;font-weight:700">처음으로</button></div>`);
      c.querySelector("button").onclick = () => { idx = -1; paint(); };
      v.appendChild(c);
      return;
    }

    const t = flat[idx];
    topbar({ title: pos.name, sub: t.sec, back: true, right: el(`<span class="count">${idx + 1} / ${flat.length}</span>`) });
    v.appendChild(el(`<div class="bar" style="margin-top:14px"><i style="width:${Math.round((idx+1)/flat.length*100)}%"></i></div>`));

    const s = el(`<div class="study" style="margin-top:22px">
      ${t.critical ? '<span class="pill crit" style="align-self:start">꼭 지키기</span>' : ""}
      <p class="big">${esc(t.title)}</p>
      <p class="body">${esc(t.desc)}</p>
      ${t.tip ? `<p class="tip"><b>선배 한마디</b> ${esc(t.tip)}</p>` : ""}
      <div class="grid2"><div class="ph">좋은 예<br>촬영 후 여기</div><div class="ph">나쁜 예<br>촬영 후 여기</div></div>
      <div style="flex:1"></div></div>`);

    if (t.critical) {
      const g = el(`<button type="button" class="btn-primary" style="padding:15px;font-weight:700">읽었습니다</button>`);
      g.onclick = () => { ok = true; nx.disabled = false; nx.style.opacity = 1; g.replaceWith(el(`<p class="muted" style="text-align:center">확인했습니다</p>`)); };
      s.appendChild(g);
    } else ok = true;

    const nav = el(`<div class="study-nav"></div>`);
    const pv = el(`<button type="button">이전</button>`);
    pv.onclick = () => { idx--; ok = false; paint(); };
    const nx = el(`<button type="button" class="btn-primary">${idx === flat.length - 1 ? "완료" : "다음"}</button>`);
    nx.onclick = () => { idx++; ok = false; paint(); };
    if (t.critical && !ok) { nx.disabled = true; nx.style.opacity = .5; }
    nav.append(pv, nx);
    s.appendChild(nav);
    if (t.critical) s.appendChild(el(`<p class="muted" style="text-align:center;margin:0">위의 [읽었습니다]를 눌러야 넘어갑니다</p>`));
    v.appendChild(s);
  }
  paint();
}

   체크리스트
 * ------------------------------------------------------------------ */
function renderChecklist(slug) {
  const pos = DATA.positions.find(p => p.slug === slug) || DATA.positions[0];
  const flat = pos.sections.flatMap(s => s.steps);
  const prefix = `list:${pos.slug}:`;
  pruneDayKeys(prefix, bizDay());
  const key = prefix + bizDay();
  let done = new Set(store.get(key, []));

  const right = el(`<span class="count"></span>`);
  topbar({ title: pos.name, sub: `${DATA.store.name} · ${pos.subtitle}`, back: true, right });
  const v = document.getElementById("view");
  const bar = el(`<div class="bar" style="margin-top:14px"><i></i></div>`);
  v.appendChild(bar);
  v.appendChild(el(`<p class="notice" style="margin-top:14px;background:var(--accent-w);border-color:var(--accent-b);color:var(--accent)"><b style="font-weight:600;font-size:13.5px">${esc(pos.summary)}</b></p>`));

  const refresh = () => {
    right.textContent = `${done.size}/${flat.length}`;
    bar.querySelector("i").style.width = `${Math.round(done.size / flat.length * 100)}%`;
  };

  pos.sections.forEach(sec => {
    const s = el(`<section class="sec"><h2>${esc(sec.title)}</h2>${sec.note ? `<p class="hint">${esc(sec.note)}</p>` : ""}<div class="rows"></div></section>`);
    /* 체크 저장 키는 반드시 t.id 다. 섹션제목+순번으로 만들면 섹션 이름을 고치거나
       항목을 중간에 끼웠을 때 체크가 조용히 다른 항목으로 옮겨간다. 원본 앱도 task.id 를 쓴다. */
    sec.steps.forEach(t => {
      const card = el(`<div class="task ${t.critical ? "keep" : ""} ${done.has(t.id) ? "done" : ""}"></div>`);
      const hit = el(`<button type="button" class="task-hit" aria-pressed="${done.has(t.id)}"></button>`);
      hit.append(el(`<span class="tick" aria-hidden="true">${CHECK}</span>`), el(`<div style="min-width:0;flex:1">
        ${t.critical ? '<div class="tags"><span class="pill crit">꼭 지키기</span></div>' : ""}
        <h3>${esc(t.title)}</h3><p class="desc">${esc(t.desc)}</p>
        ${t.tip ? `<p class="slot" style="font-weight:400;color:var(--ink-2)"><b style="font-family:var(--sans)">선배 한마디</b> ${esc(t.tip)}</p>` : ""}</div>`));
      hit.onclick = () => {
        done.has(t.id) ? done.delete(t.id) : done.add(t.id);
        store.set(key, [...done]);
        card.classList.toggle("done", done.has(t.id));
        hit.setAttribute("aria-pressed", String(done.has(t.id)));
        refresh();
      };
      card.appendChild(hit);
      s.querySelector(".rows").appendChild(card);
    });
    v.appendChild(s);
  });
  refresh();
}

render();

/** 라벨 + 입력칸 */
function field(label, input) {
  const w = el(`<div class="field"><label>${esc(label)}</label></div>`);
  w.appendChild(input);
  return w;
}

/** 숫자 입력. type=number는 태블릿에서 스크롤로 값이 바뀌는 사고가 있어 쓰지 않는다 */
function numIn(value, onChange, ph, aria, width) {
  const i = el(`<input inputmode="decimal" placeholder="${esc(ph || "")}"
    aria-label="${esc(aria || "")}"
    style="text-align:right;font-family:var(--mono);${width ? `width:${width}px` : ""}">`);
  i.value = value ? String(value) : "";
  i.oninput = () => {
    const c = i.value.replace(/[^\d.]/g, "");   // 28,000처럼 쉼표를 붙이는 사람이 많다
    onChange(c === "" ? 0 : Number(c));
  };
  return i;
}

function textIn(value, onChange, ph, aria, width) {
  const i = el(`<input placeholder="${esc(ph || "")}" aria-label="${esc(aria || "")}"
    ${width ? `style="width:${width}px"` : ""}>`);
  i.value = value || "";
  i.oninput = () => onChange(i.value);
  return i;
}

/** 눌러서 켜고 끄는 칩 */
function chip(label, on, onClick) {
  const b = el(`<button type="button" aria-pressed="${on}"
    style="padding:7px 13px;font-size:13px;font-weight:600;${on ? "background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-fill-t)" : ""}">${esc(label)}</button>`);
  b.onclick = onClick;
  return b;
}

  const inp = el(`<input type="password" inputmode="numeric" autocomplete="current-password"

  const err = el(`<p style="margin:0;font-size:13px;font-weight:600;color:var(--danger);display:none"></p>`);
  const go2 = () => {
    if (checkOwnerPin(inp.value)) { unlockOwner(); render(); }
    else { err.textContent = "번호가 맞지 않습니다."; err.style.display = "block"; }
  };
  inp.onkeydown = e => { if (e.key === "Enter") go2(); };
  const b = el(`<button type="button" class="btn-primary" style="padding:13px">열기</button>`);
  b.onclick = go2;
  box.append(inp, err, b);
  v.appendChild(card);
  return false;
}
